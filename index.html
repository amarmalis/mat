<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Material-Seite</title>
<script src="assets/qrcode.min.js"></script>
<style>
@font-face{font-family:"Source Sans 3";src:url("assets/fonts/source-sans-3-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Source Sans 3";src:url("assets/fonts/source-sans-3-latin-700-normal.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{
  --paper:#F5F8F2; --surface:#FFFFFF; --ink:#1F2A1F; --muted:#56665A; --line:#D5DDD0;
  --moss:#3E6B48; --moss-ink:#FFFFFF; --sun:#F4D58D;
  --opt-a:#F6E3A1; --opt-a-line:#D9B94A; --opt-b:#CFE3D1; --opt-b-line:#7FAE88;
  --ok:#2E7D4F; --bad:#B23A3A; --warn:#8A5A00; --star:#E0A100;
  --radius-lg:22px; --radius-sm:10px;
  --col:940px;
  --font:"Source Sans 3","Verdana","Tahoma",system-ui,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141A15; --surface:#1C241D; --ink:#E8EFE6; --muted:#A6B5A8; --line:#2F3A30;
    --moss:#8CC09A; --moss-ink:#102014; --sun:#6B5A28;
    --opt-a:#4A3F1C; --opt-a-line:#9C8436; --opt-b:#21392A; --opt-b-line:#4E7C5A;
    --ok:#7CCB98; --bad:#E58A8A; --warn:#E2B85A; --star:#F2C14E;
  }
}
:root[data-theme="dark"]{
  --paper:#141A15; --surface:#1C241D; --ink:#E8EFE6; --muted:#A6B5A8; --line:#2F3A30;
  --moss:#8CC09A; --moss-ink:#102014; --sun:#6B5A28;
  --opt-a:#4A3F1C; --opt-a-line:#9C8436; --opt-b:#21392A; --opt-b-line:#4E7C5A;
  --ok:#7CCB98; --bad:#E58A8A; --warn:#E2B85A; --star:#F2C14E;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--moss);outline-offset:3px}
img,svg{max-width:100%}
body.kid .topnav,body.kid .lizenz{display:none}

.topnav{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--line);background:var(--surface)}
.topnav .title{font-weight:700;margin-right:auto;color:var(--muted);font-size:.95rem}
.topnav a{color:var(--ink);text-decoration:none;padding:.35rem .8rem;border-radius:999px;font-size:.95rem}
.topnav a[aria-current="page"]{background:var(--moss);color:var(--moss-ink)}
main{max-width:1100px;margin:0 auto;padding:1.5rem 1rem 3rem}

.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:2px solid var(--moss);background:var(--surface);color:var(--ink);padding:.6rem 1.3rem;border-radius:999px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--moss);color:var(--moss-ink)}
.btn.small{padding:.25rem .7rem;font-size:.9rem}
.btn.big{font-size:1.3rem;padding:.8rem 1.8rem}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.stars{color:var(--star);letter-spacing:.05em;white-space:nowrap}
.figure-badge{display:inline-grid;place-items:center;width:3.6rem;height:3.6rem;border-radius:50%;overflow:hidden;flex:none}
.figure-badge img{width:100%;height:100%;display:block}

/* Gemeinsame Spalte (Whiteboard und Tablet) */
.col{max-width:var(--col);margin:0 auto}
.nav{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:1.4rem}
.nav .spacer{flex:1}

/* Whiteboard */
.stepper{display:flex;gap:.3rem 1.4rem;flex-wrap:wrap;margin:0 0 1.4rem;border-bottom:1px solid var(--line)}
.stepper button{border:none;background:none;padding:.4rem .1rem .55rem;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;font-size:1.05rem}
.stepper button[aria-current="step"]{color:var(--ink);border-color:var(--moss);font-weight:700}
.letter{position:relative;background:#FFFDF7;color:#1F2A1F;border:1px solid #E2D6BC;border-radius:4px;padding:2.4rem 3rem 2.6rem;
  box-shadow:0 1px 0 #EADFC8,0 2px 0 #FFFDF7,0 3px 0 #E2D6BC,0 14px 30px rgba(40,50,30,.10)}
.letter .kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:1.5rem;margin-bottom:1.6rem;padding-bottom:1rem;border-bottom:2px solid #EADFC8}
.letter h2{font-size:2.4rem;line-height:1.15;margin:.2rem 0 0;color:#2F4F37}
.marke{flex:none;width:7.5rem;padding:.35rem;border:3px dashed #B9A77E;border-radius:6px;background:#F3EBD8;transform:rotate(3deg)}
.marke img{display:block;width:100%;height:auto}
.letter p{font-size:1.7rem;line-height:1.55;margin:0 0 1rem}
.letter .anrede{margin-bottom:1.2rem}
.letter .gruss{font-style:italic;font-size:2rem;margin:1.6rem 0 0;color:#2F4F37}
.lead{font-size:1.5rem;margin:0 0 1rem}
.bubble{display:flex;gap:.8rem;align-items:center;background:var(--surface);border:2px solid var(--moss);border-radius:var(--radius-lg);padding:.9rem 1.2rem;font-size:1.45rem;margin:0 0 1rem}
.peek{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.2rem;align-items:start}
.peek-img{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.peek-img img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--paper)}
.peek-img .noimg{aspect-ratio:16/10;display:grid;place-items:center;font-size:5rem;background:var(--paper)}
.collect{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.8rem}
.guess-form{display:flex;gap:.5rem}
.guess-form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:.6rem 1rem;background:var(--paper);font-size:1.25rem}
.plus-btn{width:2.9rem;height:2.9rem;border-radius:50%;border:2px solid var(--moss);background:var(--moss);color:var(--moss-ink);cursor:pointer;font-weight:700;font-size:1.5rem;line-height:1;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--opt-b);border:1px solid var(--opt-b-line);border-radius:999px;padding:.25rem .4rem .25rem .9rem;font-size:1.25rem}
.chip button{border:none;background:none;cursor:pointer;font-size:1.2rem;line-height:1;padding:.1rem .35rem;color:var(--muted)}
.qr-box{display:grid;place-items:center;width:240px;height:240px;background:#fff;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.qr-box img,.qr-box canvas{width:220px!important;height:220px!important}
.qr-fallback{font-size:.75rem;word-break:break-all;color:#333}
.split{display:grid;grid-template-columns:auto 1fr;gap:2rem;align-items:start}
.steps{list-style:none;padding:0;margin:0 0 1rem;display:grid;gap:.6rem;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:.9rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.7rem 1rem;font-size:1.35rem}
.steps li::before{content:counter(s);flex:none;display:grid;place-items:center;width:2.3rem;height:2.3rem;border-radius:50%;background:var(--moss);color:var(--moss-ink);font-weight:700;font-size:1.2rem}
.tip{background:var(--surface);border-left:4px solid var(--moss);padding:.7rem 1rem;margin:0 0 1rem;font-size:1.05rem}
.brieffeld{width:100%;min-height:20rem;font-family:var(--font);font-size:1.4rem;line-height:1.5;border:1px solid #E2D6BC;border-radius:4px;padding:1.4rem 1.8rem;background:#FFFDF7;color:#1F2A1F;box-shadow:0 10px 24px rgba(40,50,30,.08)}
.mail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);margin-top:1rem;overflow:hidden}
.mail dl{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;margin:0;padding:.8rem 1.1rem;border-bottom:1px solid var(--line);font-size:1rem}
.mail dt{color:var(--muted)}
.mail dd{margin:0}
.mail pre{margin:0;padding:1rem 1.1rem;white-space:pre-wrap;font-family:var(--font);font-size:1rem}
.mail .row{padding:.8rem 1.1rem;border-top:1px solid var(--line)}
@keyframes paddle{0%{transform:translateX(-30px)}100%{transform:translateX(30px)}}
.boot{width:18rem;height:auto;animation:paddle 2.4s ease-in-out infinite alternate}

/* Tablet */
.tablet{--col:1000px}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:2.6rem;margin-bottom:.8rem}
.tbar .stars{font-size:1.9rem}
.runde{display:inline-block;background:var(--sun);border-radius:999px;padding:.15rem .9rem;font-size:1.05rem;font-weight:700;color:var(--ink);margin-left:.8rem;vertical-align:middle}
.tablet h1{font-size:2.3rem;line-height:1.2;margin:0 0 1.2rem}
.card-k{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:2rem 2.2rem}
.big-text{font-size:1.9rem;line-height:1.75;margin:0}
.big-text .wb{font-weight:700;text-decoration:underline dotted var(--moss) 2px;text-underline-offset:5px}
.big-text .wb img{height:1.5em;width:auto;vertical-align:middle;margin-left:.15em}
.pictos{display:flex;gap:1rem;flex-wrap:wrap;margin:0 0 1.4rem;padding:0;list-style:none}
.pictos li{display:flex;flex-direction:column;align-items:center;gap:.3rem;background:var(--paper);border:2px solid var(--line);border-radius:var(--radius-sm);padding:.6rem .8rem;min-width:7rem;font-weight:700;font-size:1.15rem}
.pictos img{width:6rem;height:6rem;object-fit:contain}
.uebers{margin-top:1.4rem;padding-top:1.2rem;border-top:2px dashed var(--line)}
.uebers p{font-size:1.6rem;line-height:1.6;margin:0}
.ivtr{font-size:1.4rem;color:var(--muted);border-left:4px solid var(--line);padding-left:.9rem;margin:-.6rem 0 1rem}
.tsteps{list-style:none;padding:0;margin:1.2rem 0 0;display:grid;gap:1rem;counter-reset:t}
.tsteps li{counter-increment:t;display:flex;gap:1.1rem;align-items:center;font-size:1.75rem;line-height:1.45}
.tsteps li::before{content:counter(t);flex:none;display:grid;place-items:center;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--moss);color:var(--moss-ink);font-weight:700;font-size:1.6rem}
.rollen{list-style:none;padding:0;margin:0;display:grid;gap:1.1rem}
.rollen li{display:flex;gap:1.2rem;align-items:center;font-size:1.85rem;line-height:1.4}
.rollen .sym{flex:none;display:grid;place-items:center;width:4.6rem;height:4.6rem;border-radius:50%;background:var(--opt-b);border:3px solid var(--opt-b-line);font-size:2.4rem}
.hinweis{display:flex;gap:.7rem;align-items:center;background:var(--opt-a);border:2px solid var(--opt-a-line);border-radius:var(--radius-sm);padding:.6rem 1rem;font-size:1.35rem;font-weight:700;margin:0 0 1.2rem}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem}
.choice{border-radius:var(--radius-lg);padding:1.3rem 1.1rem;cursor:pointer;border:3px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:.5rem;font-weight:700;font-size:1.55rem;color:var(--ink);text-align:center}
.choice .pic{font-size:3.6rem;line-height:1}
.choice img.pic{width:6rem;height:6rem;object-fit:contain}
.choice .sub{font-weight:400;font-size:1.3rem;line-height:1.4}
.choice.stufe .stars{font-size:3.4rem;letter-spacing:.1em}
.choice[aria-pressed="true"]{border-color:var(--moss);background:var(--opt-b);box-shadow:0 0 0 3px var(--moss) inset}
.choice:disabled{opacity:.45;cursor:default}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
.grid9 .choice{font-size:1.25rem;padding:1rem .6rem}
.grid9 .choice .pic{font-size:3rem}
.zahl{font-size:1.2rem;color:var(--muted);margin:.8rem 0 0}
.auswahl{display:flex;flex-wrap:wrap;gap:1rem}
.auswahl div{display:flex;flex-direction:column;align-items:center;gap:.4rem;min-width:9rem;background:var(--opt-a);border:3px solid var(--opt-a-line);border-radius:var(--radius-lg);padding:1rem 1.2rem;font-weight:700;font-size:1.35rem;text-align:center}
.auswahl .pic{font-size:3.2rem;line-height:1}
.auswahl img.pic{width:4.8rem;height:4.8rem;object-fit:contain}
.aufgabe{display:flex;gap:1rem;align-items:center;margin-top:1.6rem;background:var(--sun);border-radius:var(--radius-lg);padding:1rem 1.4rem;font-size:1.8rem;font-weight:700;color:var(--ink)}
.figure-hello{display:flex;gap:1.6rem;align-items:center}
.figure-hello img{width:9rem;height:auto;flex:none}
body.gross .big-text,body.gross .tsteps li,body.gross .rollen li{font-size:2.4rem}
body.gross{--ink:#000;--surface:#fff;--paper:#fff;--line:#555}

/* Lehrkraft */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:1.1rem 1.3rem;margin-bottom:1.2rem}
.panel h2{font-size:1.2rem;margin:0 0 .6rem}
.panel h3{font-size:1.05rem;margin:1.2rem 0 .4rem}
.checks{list-style:none;padding:0;margin:0}
.checks li{padding:.15rem 0}
.checks .ok::before{content:"✓ ";color:var(--ok);font-weight:700}
.checks .bad::before{content:"✗ ";color:var(--bad);font-weight:700}
.checks .warn::before{content:"! ";color:var(--warn);font-weight:700}
.edit{margin:.5rem 0 .9rem}
.edit label{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;font-weight:700;font-size:.95rem}
.edit .count{font-weight:400;color:var(--muted);font-size:.85rem}
.edit .count.over{color:var(--bad);font-weight:700}
.edit .changed{background:var(--sun);border-radius:999px;padding:0 .5rem;font-size:.8rem;color:var(--ink)}
.edit textarea{width:100%;min-height:4.5rem;font-family:var(--font);font-size:1rem;line-height:1.45;border:1px solid var(--line);border-radius:var(--radius-sm);padding:.5rem .6rem;background:var(--paper)}
.edit.is-changed textarea{border-color:var(--warn);border-width:2px}
.ro{background:var(--paper);border-radius:var(--radius-sm);padding:.5rem .7rem;font-size:.95rem;margin:.3rem 0 .8rem}
textarea.json{width:100%;min-height:14rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;border:1px solid var(--line);border-radius:var(--radius-sm);padding:.6rem;background:var(--paper)}
input[type=text]{border:1px solid var(--line);border-radius:var(--radius-sm);padding:.5rem;background:var(--paper)}
.wide{width:100%}
.msg{margin-top:.5rem}
.msg.bad{color:var(--bad)}
.phases{margin:0;padding-left:1.2rem}
.phases li{margin:.25rem 0}

/* Lesefutter-Karten (Druck: zwei Karten je A4-Hochformat) */
.sheet{background:#fff;color:#000;max-width:210mm;margin:0 auto 1.5rem;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.card{height:148mm;padding:6mm 8mm 5mm;display:flex;flex-direction:column;gap:2mm;font-size:10pt;line-height:1.2;overflow:hidden;color:#000}
.card + .card{border-top:1.5px dashed #777;position:relative}
.card + .card::before{content:"✂";position:absolute;top:-3.4mm;left:4mm;font-size:12pt;background:#fff;padding:0 1mm;color:#555}
.card .kopf{display:flex;align-items:center;gap:4mm}
.card .kopf h2{font-size:15pt;margin:0;flex:1}
.card .kopf img{height:15mm;width:auto}
.card .stufe-k{text-align:center;font-size:9pt;font-weight:700}
.card .name{display:flex;gap:2mm;align-items:flex-end;font-size:10.5pt}
.card .name span{flex:1;border-bottom:1.2px solid #000;height:6mm}
.card h3{font-size:10.5pt;margin:0}
.card .wahl{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.card .spalte{display:flex;flex-direction:column;gap:1.2mm}
.card .opt{display:flex;align-items:center;gap:2mm;border:1.4px solid #000;border-radius:2mm;padding:1.4mm 2.4mm;font-size:11pt;font-weight:700}
.card .opt .sym{font-size:14pt;line-height:1}
.card .opt img{width:8mm;height:8mm;object-fit:contain}
.card .weiter-k{display:flex;align-items:center;gap:2mm;font-size:9.5pt;font-weight:700;padding-left:2mm}
.card .weiter-k .klein{font-weight:400}
.card .pfeil{width:4.5mm;height:6mm;flex:none}
.sq{width:4.4mm;height:4.4mm;border:1.4px solid #000;border-radius:.8mm;flex:none;display:inline-block}
.card .sterne{display:flex;gap:2mm;margin-top:.5mm}
.card .sterne svg{width:10.5mm;height:10.5mm}
.card .g9{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:13mm;gap:1.4mm}
.card .g9 > div{display:flex;align-items:center;gap:.9mm;border:1px solid #888;border-radius:1.5mm;padding:.6mm 1.4mm .6mm 1.2mm;font-size:8.1pt;line-height:1.1;overflow:hidden;word-break:normal;hyphens:auto}
.card .g9 .sym{font-size:11pt}
.card .g9 .t{min-width:0;hyphens:auto;-webkit-hyphens:auto}
.card .g9 > div.w{grid-column:1 / -1}
.card .g9 .l{flex:1;align-self:flex-end;border-bottom:1px solid #000;height:4mm;margin:0 1mm 1.6mm}
.card .zeile3{display:flex;align-items:center;gap:4mm}
.card .zeile3 .opts{display:flex;gap:2mm;flex:1}
.card .zeile3 .opt{flex:1;font-weight:400}
.card .fund{margin-top:auto;display:grid;grid-template-columns:auto 1fr;column-gap:2mm;row-gap:3mm;align-items:end;font-size:10pt;font-weight:700}
.card .fund .l{border-bottom:1.2px solid #000;height:5mm}
.card .fund .l.voll{grid-column:1 / -1}
@page{size:A4 portrait;margin:0}

.lizenz{font-size:.85rem;color:var(--muted);max-width:1100px;margin:0 auto;padding:0 1rem 2rem}
.lizenz a{color:var(--muted)}
@media print{
  .topnav,.no-print,.lizenz{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .sheet{box-shadow:none;margin:0;page-break-after:always;break-after:page;width:210mm}
}
@media (max-width:760px){
  .letter{padding:1.4rem}
  .letter p{font-size:1.3rem}
  .letter h2{font-size:1.7rem}
  .marke{width:5rem}
  .big-text,.tsteps li,.rollen li{font-size:1.4rem}
  .tablet h1{font-size:1.7rem}
  .card-k{padding:1.2rem}
  .split,.peek{display:block}
  .qr-box{margin-bottom:1rem}
  .grid9{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){ .boot{animation:none} }
</style>
</head>
<body>
<nav class="topnav no-print" aria-label="Ansichten">
  <span class="title">Material-Seite (Prototyp)</span>
  <a href="#klasse" data-view="klasse">Klasse (Whiteboard)</a>
  <a href="#tablet" data-view="tablet">Tablet</a>
  <a href="#suchkarte" data-view="suchkarte">Lesefutter-Karten</a>
  <a href="#lehrkraft" data-view="lehrkraft">Lehrkraft</a>
</nav>
<main id="app">Inhalte werden geladen …</main>
<footer class="lizenz no-print">Piktogramme: <a href="https://arasaac.org">ARASAAC</a>, Lizenz <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.de">CC BY-NC-SA 4.0</a>. Diese Seite steht unter derselben Lizenz.</footer>

<script>
// ===== Festes im Template =====
const FIGUR = "Frido";
const FIGUR_KOPF = "assets/biber/biber-kopf.svg";
const FIGUR_WINKT = "assets/biber/biber-winkt.svg";
const FIGUR_BOOT = "assets/biber/biber-unterwegs.svg";
const FIGUR_BUCH = "assets/biber/biber-buch.svg";
// Das ARASAAC-Piktogramm „Biber“ steht für Frido; die Website zeigt dafür die Frido-Figur.
const FIGUR_PICTO = 7055;
const FRAGE_BIBLIOTHEK = "Was erwartet euch beim Besuch? Was vermutet ihr?";
const STUFEN = {1:{sym:"⭐", name:"ein Stern"}, 2:{sym:"⭐⭐", name:"zwei Sterne"}, 3:{sym:"⭐⭐⭐", name:"drei Sterne"}};
const LIM_TEXT = {stufe1:180, stufe2:300, stufe3:450};
const LIM_BRIEF = 400, LIM_WORT = 15, LIM_SUCHWORT = 30, WORTBILDER_MAX = 20;
const LIM_AB = {anrede:80, einleitung:300, vor_vermutungen:120, vor_fragen:120, schluss:200, gruss:60};

function store(key, val){
  try{
    if(val===undefined) return localStorage.getItem(key);
    if(val===null) localStorage.removeItem(key); else localStorage.setItem(key,val);
  }catch(e){ return null; }
}

// ===== Hilfsfunktionen =====
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class") n.className=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if(v!==false && v!=null) n.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; n.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return n;
}
function isInt(v){ return typeof v==="number" && Number.isInteger(v); }
function isObj(v){ return v!==null && typeof v==="object" && !Array.isArray(v); }
function speak(text, lang){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/[🎤💬⭐✏️🔁]/gu,"")); u.lang=lang||"de-DE"; u.rate=0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}

// Brief in Anrede, Hauptteil und Gruß zerlegen (Zeilenumbrüche; ältere Texte ohne Umbruch werden erkannt)
function briefTeile(text){
  let zeilen = String(text||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  let anrede = null, gruss = null;
  if(zeilen.length && /^Hallo[^!]{0,40}!/.test(zeilen[0])){
    const m = /^(Hallo[^!]{0,40}!)\s*(.*)$/.exec(zeilen[0]);
    anrede = m[1]; if(m[2]) zeilen[0] = m[2]; else zeilen.shift();
  }
  if(zeilen.length){
    const letzte = zeilen[zeilen.length-1];
    const m = /^(.*?[.!?])?\s*((?:[^.!?]{0,30},\s*)?euer\s+\S+)\s*$/.exec(letzte);
    if(m){ gruss = m[2]; if(m[1]) zeilen[zeilen.length-1] = m[1]; else zeilen.pop(); }
  }
  return {anrede, haupt:zeilen, gruss};
}

function wortbildRegex(){
  const wb = Array.isArray(G().wortbilder) ? G().wortbilder.filter(e=>isObj(e) && typeof e.wort==="string" && e.wort) : [];
  if(!wb.length) return null;
  const words = wb.map(e=>e.wort).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  return {re:new RegExp("(?<![\\p{L}\\p{N}])("+words.join("|")+")(?![\\p{L}\\p{N}])","gu"), map:Object.fromEntries(wb.map(e=>[e.wort, e]))};
}
function textMitWortbildern(text){
  const p = el("p",{class:"big-text"});
  const wr = T.stufe===1 ? wortbildRegex() : null;
  if(!wr){ p.textContent = text; return p; }
  let last = 0;
  for(const m of text.matchAll(wr.re)){
    p.append(text.slice(last, m.index));
    const e = wr.map[m[0]];
    const s = el("span",{class:"wb"}, m[0]);
    if(hatBilddatei(e)) s.append(el("img",{src:e.picto===FIGUR_PICTO?FIGUR_KOPF:"assets/pictos/"+e.picto+".png",alt:""}));
    p.append(s); last = m.index + m[0].length;
  }
  p.append(text.slice(last));
  return p;
}
function abschnittText(){ const a = abschnitte()[T.ab]; return a ? a.text["stufe"+T.stufe] : ""; }

  const text = abschnittText();

  if(tools.childNodes.length) wrap.append(tools);
  const letzte = T.ab===abschnitte().length-1;
  wrap.append(el("div",{class:"nav"},
    el("button",{class:"btn big",type:"button",onclick:()=>{ if(T.ab===0){ T.phase="start"; T.stufe=null; } else T.ab--; render(); }}, IV.knopf.zurueck),
    el("button",{class:"btn primary big",type:"button",onclick:()=>{ if(letzte){ T.phase="interview"; T.iv.schritt="rollen"; } else T.ab++; render(); }}, letzte ? IV.sachtext.weiter : IV.knopf.weiter)));
}

function trText(getter){
  const c = T.iv.sprache; if(!c || !IV_TR[c]) return null;
  try{ const t = getter(IV_TR[c]); return t ? el("p",{class:"ivtr",lang:c,dir:RTL.includes(c)?"rtl":"ltr"}, t) : null; }catch(e){ return null; }
}
function navIv(...rechts){ return el("div",{class:"nav"}, el("button",{class:"btn big",type:"button",onclick:ivZurueck}, IV.knopf.zurueck), ...rechts); }
function themaListe(art){ return IV.thema.listen[art || T.iv.art] || []; }
function auswahlKarten(erg){
  const a = IV.art.optionen[erg.art], f = IV.format.optionen[erg.format];
  const karten = [el("div",{}, el("span",{class:"pic","aria-hidden":"true"}, a.symbol), a.label)];
  erg.themen.forEach(i=>{ const th = themaListe(erg.art)[i]; karten.push(el("div",{}, el("span",{class:"pic","aria-hidden":"true"}, th.symbol), th.weitere ? th.label+" (Stichwort)" : th.label)); });
  karten.push(el("div",{}, el("img",{class:"pic",src:f.bild,alt:""}), f.kurz));
  return karten;
}
function auswahlText(erg){
  const a = IV.art.optionen[erg.art], f = IV.format.optionen[erg.format];
  return [a.label, ...erg.themen.map(i=>themaListe(erg.art)[i].label), f.kurz].join(", ");

function rundeFertig(){
  T.erg[T.iv.runde] = {art:T.iv.art, themen:T.iv.themen.slice(), format:T.iv.format};
  if(T.iv.runde===1) geheZu("tausch"); else geheZu("holen");

    wrap.append(navIv(el("button",{class:"btn primary big",type:"button",disabled:!T.iv.themen.length,onclick:()=>geheZu("format")}, IV.knopf.weiter)));
  }else if(s==="format"){

      el("img",{class:"pic",src:o.bild,alt:""}), el("span",{}, o.label)))));

  }else if(s==="holen"){

      const kopf = fill(u.runde,{n});
      wrap.append(el("div",{class:"card-k",style:"margin-bottom:1rem"}, el("p",{class:"big-text",style:"font-size:1.4rem;font-weight:700;margin-bottom:.8rem"}, kopf), el("div",{class:"auswahl"}, auswahlKarten(erg))));
      lesen.push(kopf.replace("💬","")+": "+auswahlText(erg)); });
    const schritte = u["stufe"+T.stufe].map(x=>fill(x,{sterne}));
    wrap.append(el("ol",{class:"tsteps"}, schritte.map(x=>el("li",{}, x))));
    lesen.push(...u["stufe"+T.stufe].map(x=>fill(x,{sterne:STUFEN[T.stufe].name})));
    wrap.append(navIv(el("button",{class:"btn primary big",type:"button",onclick:()=>geheZu("ende")}, IV.knopf.weiter)));
  }else if(s==="ende"){
    const t2 = S(IV.abschluss);
    wrap.append(el("div",{class:"card-k figure-hello"}, el("img",{src:FIGUR_WINKT,alt:""}), el("p",{class:"big-text"}, t2)));
    lesen.push(t2);
    wrap.append(navIv(el("button",{class:"btn primary big",type:"button",onclick:()=>{ T = neuesTablet(); render(); }}, IV.knopf.fertig)));
  }
  if(T.stufe===1 && lesen.length){
    const nav = wrap.querySelector(".nav");
    const r = el("div",{class:"row",style:"margin-top:1rem"}, readBtn(()=>lesen.join(" ")));
    if(nav) wrap.insertBefore(r, nav); else wrap.append(r);
  }
}

// ===== Prüfung Material-Schema 0.8 (spiegelt werkzeuge/validate08.py) =====
function expectedVariants(lg){
  const v = new Set(Array.isArray(lg.lesestufen) ? lg.lesestufen : []);
  const f = lg.foerder || {};
  if((f.lernen||0)>0 || (f.sprache||0)>0) v.add("stufe1");
  if(lg.kaum_deutsch===true || (Array.isArray(lg.jahrgaenge) ? lg.jahrgaenge : []).some(j=>j===1||j===2)) v.add("bild");
  return v;
}
function wortbilderRequired(lg){ const f = lg.foerder || {}; return (f.lernen||0)>0 || (f.sprache||0)>0; }
function cutList(a){ return a.slice(0,6).join(", ")+(a.length>6?" …":""); }
function setEq(a, b){ if(a.size!==b.size) return false; for(const x of a) if(!b.has(x)) return false; return true; }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function checkEntry(e, where, liste, bad, warn){
  if(!isObj(e)){ bad.push(where+" (kein Objekt)"); return; }
  const w = e.wort;
  if(typeof w!=="string" || !w || w.length>LIM_WORT || /\s/.test(w)) bad.push(where+" (wort)");
  if(!("picto" in e)){ bad.push(where+" (picto)"); return; }
  const p = e.picto;
  if(p===null){
    const s = e.suchwort;
    if(typeof s==="string" && s.trim() && s.length<=LIM_SUCHWORT) warn.push(where+" ("+s+")");
    else bad.push(where+" (picto null ohne suchwort)");
  }else if(isInt(p)){
    if(liste && !liste.includes(p)) bad.push(where+" (ID "+p+" nicht in Liste)");
  }else bad.push(where+" (picto)");
}
function allBildEintraege(g){
  const out = [];
  const ab = isObj(g.sachtext) && Array.isArray(g.sachtext.abschnitte) ? g.sachtext.abschnitte : [];
  ab.forEach(a=>{ if(isObj(a) && isObj(a.text) && Array.isArray(a.text.bild)) a.text.bild.forEach(e=>{ if(isObj(e)) out.push(e); }); });
  if(Array.isArray(g.wortbilder)) g.wortbilder.forEach(e=>{ if(isObj(e)) out.push(e); });
  return out;
}
function validate(d, lg, liste, lgId){
  const res=[]; const add=(s,t)=>res.push({s,t});
  const meta=isObj(d.meta)?d.meta:{}, r=isObj(d.rahmen)?d.rahmen:{}, g=isObj(d.generiert)?d.generiert:{};
  const st=isObj(g.sachtext)?g.sachtext:{};
  const ab=Array.isArray(st.abschnitte)?st.abschnitte:[];
  lg = isObj(lg) ? lg : null;
  // Regel 1
  const sv = meta.schema_version;
  add(sv==="0.8"?"ok":"bad", "Schema-Version 0.8"+(sv==="0.8"?"":" (gefunden: "+(sv==null?"keine":String(sv))+")"));
  // Regel 2
  if(lg){
    const ok = meta.lerngruppe===lgId;
    add(ok?"ok":"warn", "Verweis auf Lerngruppe "+lgId+(ok?"":" (im Material: "+(meta.lerngruppe==null?"keiner":meta.lerngruppe)+")"));
  }else add("warn","Lerngruppe nicht geladen: Prüfung ohne Abgleich mit der Lerngruppe");
  // Regel 3
  let ok = !!(r.klasse && r.bibliothek && r.programmtitel);
  const bilder = r.bilder;
  if(bilder!==undefined && bilder!==null) ok = ok && Array.isArray(bilder) && bilder.every(b=>isObj(b) && b.datei && b.beschreibung);
  add(ok?"ok":"bad","Rahmendaten vollständig, jedes Bild mit Datei und Beschreibung");
  // Regel 4
  const bt = isObj(g.brief) ? g.brief.text : undefined;
  ok = typeof bt==="string" && bt.length>0 && bt.length<=LIM_BRIEF;
  add(ok?"ok":"bad","Brief vorhanden, max. 400 Zeichen"+(typeof bt==="string"?" ("+bt.length+")":""));
  // Regel 5
  if(typeof bt==="string" && bt){
    const anrede = "Hallo "+String(r.klasse||"")+"!";
    ok = bt.trim().startsWith(anrede) && bt.trim().endsWith("euer Frido");
    add(ok?"ok":"warn","Brief beginnt mit „"+anrede+"“ und endet mit „euer Frido“");
  }
  // Regel 6
  const bb = g.bibliotheksblick;
  ok = Array.isArray(bb) && bb.length===1 && bb.every(x=>isObj(x) && isInt(x.bild) && Array.isArray(bilder) && x.bild>=0 && x.bild<bilder.length);
  add(ok?"ok":"bad","Blick in die Bibliothek: genau 1 Bild");
  // Regel 7
  const q = st.quellen;
  const qOk = Array.isArray(q) && q.length>0 && q.every(x=>typeof x==="string" && x);
  ok = ab.length>=1 && ab.length<=2 && ab.every(a=>isObj(a) && isObj(a.text)) && qOk;
  add(ok?"ok":"bad","Sachtext mit 1 oder 2 Abschnitten und Quellen"+(ok?"":" (Abschnitte: "+ab.length+", Quellen: "+(qOk?"ja":"keine")+")"));
  // Regel 8
  let soll, basis;
  if(lg){ soll = expectedVariants(lg); basis = "Lerngruppe"; }
  else{ const t0 = ab[0] && isObj(ab[0].text) ? ab[0].text : null; soll = new Set(t0 ? Object.keys(t0) : []); basis = "Abschnitt 1"; }
  const falsch=[];
  ab.forEach((a,i)=>{ const ist = new Set(isObj(a) && isObj(a.text) ? Object.keys(a.text) : []); if(!setEq(ist, soll)) falsch.push("Abschnitt "+(i+1)); });
  const vtext = [...soll].sort().join(", ") || "keine";
  add((falsch.length||!soll.size)?"bad":"ok","Varianten wie "+basis+" ("+vtext+")"+(falsch.length?" – abweichend: "+cutList(falsch):""));
  // Regel 9
  const lang=[];
  ab.forEach((a,i)=>{ if(!isObj(a)||!isObj(a.text)) return;
    ["stufe1","stufe2","stufe3"].forEach(s=>{ if(!(s in a.text)) return; const t=a.text[s];
      if(typeof t!=="string" || !t) lang.push("Abschnitt "+(i+1)+"/"+s+" (leer)");
      else if(t.length>LIM_TEXT[s]) lang.push("Abschnitt "+(i+1)+"/"+s+" ("+t.length+")"); });
  });
  add(lang.length?"bad":"ok","Längengrenzen der Abschnitte (180/300/450)"+(lang.length?" – "+cutList(lang):""));
  // Regel 10
  const folgeBad=[], eintragBad=[], eintragWarn=[];
  ab.forEach((a,i)=>{ if(!isObj(a)||!isObj(a.text)||!("bild" in a.text)) return;
    const b=a.text.bild;
    if(!Array.isArray(b) || b.length<1 || b.length>4){ folgeBad.push("Abschnitt "+(i+1)); return; }
    b.forEach((e,x)=>checkEntry(e, "Abschnitt "+(i+1)+"/Bild "+(x+1), liste, eintragBad, eintragWarn));
  });
  add(folgeBad.length?"bad":"ok","Bildfolgen: 1–4 Einträge"+(folgeBad.length?" – falsch: "+cutList(folgeBad):""));
  // Regel 11
  const wb = g.wortbilder; const wbBad=[], wbWarn=[];
  const pflicht = !!lg && wortbilderRequired(lg);
  if(wb===undefined || wb===null){
    if(pflicht) add("bad","Wortbilder fehlen (Pflicht wegen Förderbedarf Lernen oder Sprache)");
  }else if(!Array.isArray(wb) || wb.length<1 || wb.length>WORTBILDER_MAX){
    add("bad","Wortbilder: 1–20 Einträge");
  }else{
    wb.forEach((e,x)=>checkEntry(e, "Wortbild "+(x+1), liste, wbBad, wbWarn));
    add(wbBad.length?"bad":"ok","Wortbilder gültig ("+wb.length+")"+(wbBad.length?" – falsch: "+cutList(wbBad):""));
    const s1 = ab.filter(a=>isObj(a)&&isObj(a.text)&&typeof a.text.stufe1==="string").map(a=>a.text.stufe1);
    const fehlt=[];
    wb.forEach(e=>{ const w = isObj(e) ? e.wort : undefined;
      if(typeof w==="string" && w){ const re = new RegExp("(?<![\\p{L}\\p{N}_])"+escRe(w)+"(?![\\p{L}\\p{N}_])","iu"); if(!s1.some(t=>re.test(t))) fehlt.push(w); } });
    add(fehlt.length?"warn":"ok","Jedes Wortbild kommt in einem ⭐-Text vor"+(fehlt.length?" – nicht gefunden: "+cutList(fehlt):""));
  }
  const alleBad = eintragBad.concat(wbBad), alleWarn = eintragWarn.concat(wbWarn);
  add(alleBad.length?"bad":"ok","Bild-Einträge: ein Wort (max. 15 Zeichen), Piktogramm aus der Liste"+(alleBad.length?" – falsch: "+cutList(alleBad):""));
  if(!liste) add("warn","Piktogramm-Liste nicht geladen: IDs nicht abgeglichen");
  add(alleWarn.length?"warn":"ok","Alle Piktogramme vorhanden"+(alleWarn.length?" – nachtragen: "+cutList(alleWarn):""));
  // Regeln 12 und 13
  const ue = g.uebersetzungen;
  const ueObj = isObj(ue) ? ue : {};
  const ueBad=[], ueWarn=[];
  if(ue!==undefined && ue!==null && !isObj(ue)) ueBad.push("kein Objekt");
  const sollSpr = lg && Array.isArray(lg.sprachen) ? lg.sprachen : null;
  if(sollSpr){
    sollSpr.forEach(c=>{ if(!(c in ueObj)) ueBad.push(c+" fehlt"); });
    Object.keys(ueObj).forEach(c=>{ if(!sollSpr.includes(c)) ueBad.push(c+" ohne Sprachcode in der Lerngruppe"); });
  }
  Object.entries(ueObj).forEach(([c,u])=>{
    if(!isObj(u) || !Array.isArray(u.abschnitte) || u.abschnitte.length!==ab.length || !u.abschnitte.every(t=>typeof t==="string" && t)){ ueBad.push(c+" ("+ab.length+" Texte)"); return; }
    if(!(u.stufe in LIM_TEXT)){ ueBad.push(c+" (stufe)"); return; }
    u.abschnitte.forEach((t,i)=>{ if(t.length>LIM_TEXT[u.stufe]) ueWarn.push(c+"/Abschnitt "+(i+1)+" ("+t.length+")"); });
  });
  if(sollSpr || Object.keys(ueObj).length) add(ueBad.length?"bad":"ok","Übersetzungen: je Sprache der Lerngruppe ein Text je Abschnitt"+(ueBad.length?" – "+cutList(ueBad):""));
  if(Object.keys(ueObj).length) add(ueWarn.length?"warn":"ok","Übersetzungen innerhalb der Längengrenze der übersetzten Stufe"+(ueWarn.length?" – "+cutList(ueWarn):""));
  // Regel 14
  const abr = isObj(g.antwortbrief) ? g.antwortbrief : null;
  const abBad=[];
  if(!abr) abBad.push("fehlt");
  else AB_FELDER.forEach(f=>{ const v=abr[f]; if(typeof v!=="string" || !v.trim()) abBad.push(f+" leer"); else if(v.length>LIM_AB[f]) abBad.push(f+" ("+v.length+")"); });
  add(abBad.length?"bad":"ok","Antwortbrief: 6 Felder, Längengrenzen eingehalten"+(abBad.length?" – "+cutList(abBad):""));
  // Regel 15
  add(Array.isArray(g.luecken)?"ok":"bad","Lückenliste vorhanden");
  // Regel 16
  const alt = ["geschichte","plan","teamnamen","absenden_text"].filter(k=>k in g);
  add(alt.length?"bad":"ok","Keine Felder aus früheren Schemata"+(alt.length?" – "+cutList(alt):""));
  // Regel 17
  if(lg && isInt(lg.tablets)){
    const nv = expectedVariants(lg).size;
    add(lg.tablets>=nv?"ok":"warn","Tablets ("+lg.tablets+") reichen für alle Varianten ("+nv+")");
  }
  return res;
}

// ===== Lehrkraft =====
function lgInfo(){
  if(!LG) return el("p",{style:"margin:0"},"Keine Lerngruppe geladen. Die Prüfung gleicht das Material nicht mit den Angaben der Lehrkraft ab.");
  const f = LG.foerder || {};
  const fb = [["sehen","Sehen"],["lernen","Lernen"],["sprache","Sprache"],["motorik","Motorik"]].filter(([key])=>(f[key]||0)>0).map(([key,name])=>name+": "+f[key]);
  const ev = expectedVariants(LG);
  const v = ["stufe1","stufe2","stufe3","bild"].filter(x=>ev.has(x)).map(x=>x==="bild" ? "Bildfassung" : STUFEN[Number(x.slice(-1))].sym);
  return el("ul",{style:"margin:0"},
    el("li",{},"Klasse: "+(LG.klasse||"–")+", Tablets: "+(LG.tablets??"–")+", Jahrgänge: "+((LG.jahrgaenge||[]).join(", ")||"–")),
    el("li",{},"Varianten des Sachtexts: "+(v.join(", ")||"–")),
    el("li",{},"Förderbedarfe: "+(fb.join(", ")||"keine")),
    el("li",{},"Familiensprachen: "+((LG.sprachen||[]).map(spracheName).join(", ")||"keine")));
}
function editField(path, label, limit){
  const orig = getPath(DATA.generiert, path);
  if(typeof orig!=="string") return null;
  const changed = Object.prototype.hasOwnProperty.call(EDITS, path);
  const wrap = el("div",{class:"edit"+(changed?" is-changed":"")});
  const ta = el("textarea",{"aria-label":label, rows:String(Math.min(8, Math.max(2, Math.ceil(orig.length/90)+(orig.split("\n").length-1))))});
  ta.value = changed ? EDITS[path] : orig;
  const count = el("span",{class:"count"});
  const upd = ()=>{ count.textContent = ta.value.length+(limit?" / "+limit:"")+" Zeichen"; count.classList.toggle("over", !!limit && ta.value.length>limit); };
  upd();
  ta.addEventListener("input", upd);
  ta.addEventListener("change", ()=>{
    if(ta.value===orig) delete EDITS[path]; else EDITS[path]=ta.value;
    saveEdits(); render();
  });
  wrap.append(el("label",{}, label, count, changed ? el("span",{class:"changed"},"geändert") : null,
    changed ? el("button",{class:"btn small",type:"button",onclick:()=>{ delete EDITS[path]; saveEdits(); render(); }},"Original") : null), ta);
  return wrap;
}
function geprueftesJSON(){
  const d = JSON.parse(JSON.stringify(M()));
  const n = Object.keys(EDITS).length;
  const heute = new Date().toISOString().slice(0,10);
  const v = "Redaktionell durchgesehen am "+heute+(n ? "; "+n+" Text"+(n===1?"":"e")+" geändert ("+Object.keys(EDITS).join(", ")+")" : "; ohne Änderungen")+".";
  d.meta = d.meta || {}; d.meta.hinweis = d.meta.hinweis ? d.meta.hinweis+" "+v : v;
  return d;
}
function download(name, text){
  const a = el("a",{href:URL.createObjectURL(new Blob([text],{type:"application/json"})), download:name});
  document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function durchsicht(){
  const g = DATA.generiert, n = Object.keys(EDITS).length;
  const p = el("section",{class:"panel"}, el("h2",{},"Durchsicht und Korrektur"));
  p.append(el("p",{style:"margin-top:0"},"Lesen Sie Brief, Sachtext und Antwortbrief vor der Stunde. Auch regelkonforme Texte können vereinzelt Aussagen enthalten, die nicht stimmen (zum Beispiel über den Ablauf des Besuchs). Korrigieren Sie sie direkt im Feld."));
  p.append(el("p",{class:"tip",style:"font-size:1rem"},"Änderungen gelten zunächst nur in diesem Browser (Whiteboard). Damit auch die Tablets sie zeigen, laden Sie die geprüfte Fassung herunter und legen sie als materialien/"+(MATERIAL_ID||"<ID>")+".json ins Repository."));
  p.append(el("div",{class:"row",style:"margin-bottom:.4rem"},
    el("button",{class:"btn primary",type:"button",onclick:()=>download((MATERIAL_ID||(DATA.meta&&DATA.meta.lerngruppe)||"material")+".json", JSON.stringify(geprueftesJSON(),null,2))},"Geprüfte Fassung herunterladen"),
    n ? el("button",{class:"btn",type:"button",onclick:()=>{ EDITS={}; saveEdits(); render(); }},"Alle Änderungen verwerfen") : null,
    el("span",{class:"muted"}, n ? n+" Text"+(n===1?"":"e")+" geändert" : "Noch nichts geändert")));
  p.append(el("h3",{},"Fridos Brief (Phase 1)"), editField("brief.text","Brief (Anrede, Hauptteil und „euer Frido“ je in einer eigenen Zeile)",LIM_BRIEF));
  const st = isObj(g.sachtext) ? g.sachtext : {};
  if(Array.isArray(st.quellen)) p.append(el("div",{class:"ro"}, el("strong",{},"Quellen des Sachtexts: "), st.quellen.join(", ")));
  (Array.isArray(st.abschnitte) ? st.abschnitte : []).forEach((a,i,arr)=>{
    p.append(el("h3",{},"Sachtext"+(arr.length>1?", Teil "+(i+1):"")+" (Phase 2)"));
    [1,2,3].forEach(s=>{ const f = editField("sachtext.abschnitte."+i+".text.stufe"+s, STUFEN[s].sym, LIM_TEXT["stufe"+s]); if(f) p.append(f); });
    if(isObj(a.text) && Array.isArray(a.text.bild)) p.append(el("div",{class:"ro"}, el("strong",{},"Bildfassung: "), a.text.bild.map(e=>(e.wort||"?")+(hatBilddatei(e)?"":" (ohne Bild, wird nicht angezeigt)")).join(" · ")));
    Object.entries(isObj(g.uebersetzungen)?g.uebersetzungen:{}).forEach(([c,u])=>{
      if(isObj(u) && Array.isArray(u.abschnitte)) p.append(el("div",{class:"ro",lang:c,dir:RTL.includes(c)?"rtl":"ltr"}, el("strong",{lang:"de",dir:"ltr"}, spracheName(c)+" (maschinell übersetzt, nicht geprüft): "), u.abschnitte[i]||""));
    });
  });
  p.append(el("h3",{},"Rahmen des Antwortbriefs (Phase 3)"));
  AB_FELDER.forEach(f=>{ const e = editField("antwortbrief."+f, AB_LABEL[f], LIM_AB[f]); if(e) p.append(e); });
  return p;
}
function renderLehrkraft(app){
  const meta=DATA.meta||{};
  const sv = meta.schema_version;
  if(sv!=="0.8"){
    app.append(el("h1",{style:"font-size:1.6rem;margin-top:0"},"Lehrkraftansicht"));
    app.append(el("section",{class:"panel"}, el("h2",{},"Material im falschen Schema"),
      el("p",{style:"margin:0"},"Das geladene Material hat das Schema "+(sv||"ohne Angabe")+". Diese Seite zeigt und prüft nur Schema 0.8 (Sachtext). Laden Sie unten Material aus System Prompt 2 v0.8.")));
    app.append(ladenPanel());
    return;
  }
  const g=G(), r=R();
  app.append(el("h1",{style:"font-size:1.6rem;margin-top:0"},"Lehrkraftansicht: "+r.programmtitel+", Klasse "+r.klasse));
  app.append(el("section",{class:"panel"}, el("h2",{},"Ablauf der Stunde"),
    el("ol",{class:"phases"},
      el("li",{}, el("strong",{},"Phase 1, ganze Klasse (8 Min.): "),"Fridos Brief am Whiteboard vorlesen, Foto der Bibliothek ansehen, Vermutungen sammeln. Sie tippen die Vermutungen mit."),
      el("li",{}, el("strong",{},"Phase 2, Paare am Tablet (25 Min.): "),"Code scannen, Lesestufe wählen, Sachtext „Das erwartet euch“ lesen, dann Interview mit Rollentausch; die Antworten tippen die Kinder am Tablet an. Erst danach holen sie sich ein Blatt mit zwei Lesefutter-Karten, schneiden es durch und übertragen ihre Antworten."),
      el("li",{}, el("strong",{},"Phase 3, ganze Klasse (7 Min.): "),"Fragen an die Bibliothek sammeln. Die Website setzt Vermutungen und Fragen in den Brief der Klasse ein; Sie können ihn ändern und abschicken.")),
    el("div",{class:"row",style:"margin-top:.8rem"},
      el("a",{class:"btn",href:"#suchkarte"},"Lesefutter-Karten drucken"),
      el("a",{class:"btn",href:"#klasse"},"Zum Whiteboard"))));
  const l = Array.isArray(g.luecken)?g.luecken:[];
  app.append(el("section",{class:"panel"}, el("h2",{},"Fehlende Angaben im Programmprofil"), l.length? el("ul",{style:"margin:0"}, l.map(x=>el("li",{},x))) : el("p",{style:"margin:0"},"Keine.")));
  app.append(el("section",{class:"panel"}, el("h2",{},"Automatische Prüfung"), el("ul",{class:"checks"}, validate(M(), LG, PICTOS, LG_ID).map(c=>el("li",{class:c.s},c.t)))));
  app.append(durchsicht());
  app.append(el("section",{class:"panel"}, el("h2",{},"Lerngruppe"), lgInfo()));
  app.append(el("section",{class:"panel"}, el("h2",{},"Herkunft"),
    el("p",{style:"margin:0"},"Erzeugt von: "+(meta.erzeugt_von||"keine Angabe")+". Prompt-Version: "+(meta.prompt_version||"keine Angabe")+". Datum: "+(meta.erzeugt_am||"keine Angabe")+"."),
    meta.hinweis ? el("p",{class:"muted",style:"margin:.4rem 0 0"}, meta.hinweis) : null));
  const ids = [...new Set(allBildEintraege(g).filter(e=>isInt(e.picto)).map(e=>e.picto))].sort((a,b)=>a-b);
  const fehlend = ids.filter(id=>id!==FIGUR_PICTO && !PICTO_DA.has(id));
  const ohne = [...new Set(allBildEintraege(g).filter(e=>e.picto===null).map(e=>e.wort+(e.suchwort?" (Suchwort: "+e.suchwort+")":"")))];
  app.append(el("section",{class:"panel"}, el("h2",{},"Piktogramme"),
    el("p",{style:"margin-top:0"}, fehlend.length ? "Diese Bilddateien fehlen noch im Ordner assets/pictos/ (Dateiname <ID>.png, von arasaac.org): "+fehlend.join(", ")+". Einträge ohne Bilddatei zeigt das Tablet nicht an." : "Alle Bilddateien zu den Piktogramm-IDs sind vorhanden."),
    ohne.length ? el("p",{style:"margin:0"},"Ohne Piktogramm in der Liste (werden nicht angezeigt): "+ohne.join("; ")+".") : null));
  const q=[["Brief",g.brief&&g.brief.quellen],["Sachtext",g.sachtext&&g.sachtext.quellen],["Piktogramme",["ARASAAC (arasaac.org), CC BY-NC-SA 4.0"]],["Figur Frido",["eigene Zeichnung"]]];
  app.append(el("section",{class:"panel"}, el("h2",{},"Quellen"), el("ul",{style:"margin:0"}, q.map(([n,s])=>el("li",{}, n+": "+((s&&s.length)?s.join(", "):"keine Angabe"))))));
  app.append(ladenPanel());
  const bu = el("input",{type:"text",class:"wide",value:baseUrl()});
  app.append(el("section",{class:"panel"}, el("h2",{},"Adresse für den QR-Code"),
    el("p",{style:"margin-top:0"},"Der QR-Code für die Tablets führt zu dieser Adresse. Normalerweise müssen Sie hier nichts ändern."),
    bu, el("div",{class:"row",style:"margin-top:.6rem"}, el("button",{class:"btn",type:"button",onclick:()=>{ store("ms_base",bu.value.trim()||null); render(); }},"Adresse übernehmen"))));
}
function ladenPanel(){
  const ta = el("textarea",{class:"json","aria-label":"JSON der Material-Seite",spellcheck:"false"}); if(DATA) ta.value = JSON.stringify(DATA,null,2);
  const msg = el("div",{class:"msg"});
  return el("section",{class:"panel"}, el("h2",{},"Inhalte laden"),
    el("p",{style:"margin-top:0"}, MATERIAL_ID ? "Dieses Material stammt aus der Datei materialien/"+MATERIAL_ID+".json. Hier eingefügtes JSON gilt nur zum Ausprobieren und wird nicht gespeichert." : "Fügen Sie hier das JSON ein, das das Sprachmodell erzeugt hat. Es wird nur in diesem Browser gespeichert. Die Lerngruppe wird über meta.lerngruppe aus dem Ordner „lerngruppen“ nachgeladen."),
    ta,
    el("div",{class:"row",style:"margin-top:.6rem"},
      el("button",{class:"btn primary",type:"button",onclick:()=>{
        try{ const d=JSON.parse(ta.value); if(!d.rahmen||!d.generiert) throw new Error("Die Bereiche „rahmen“ und „generiert“ fehlen.");
          DATA=d; MERGED=null; if(!MATERIAL_ID){ store("ms_json",JSON.stringify(d)); } ladeLerngruppe(d).then(ladeInterview).then(pruefePictoDateien).then(render); }
        catch(err){ msg.className="msg bad"; msg.textContent="Nicht geladen: "+err.message; } }},"JSON laden"),
      DATA ? el("button",{class:"btn",type:"button",onclick:()=>{ if(MATERIAL_ID) location.reload(); else { store("ms_json",null); DATA=localData(); MERGED=null; render(); } }}, MATERIAL_ID?"Gespeichertes Material neu laden":"Eingefügtes Material entfernen") : null),
    msg);
}

// ===== Router =====
function currentView(){
  const h = location.hash.replace("#","");
  if(h==="tablet" || /^tablet-\d$/.test(h)) return "tablet";
  if(h==="lehrkraft") return "lehrkraft";
  if(h==="suchkarte") return "suchkarte";
  return "klasse";
}
function render(){
  try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){}
  const app=document.getElementById("app"); app.innerHTML="";
  const v=currentView();
  window.scrollTo(0,0);
  document.body.classList.toggle("kid", v==="tablet");
  if(v!=="tablet") document.body.classList.remove("gross");
  document.querySelectorAll(".topnav a").forEach(a=>a.setAttribute("aria-current", a.dataset.view===v?"page":"false"));
  if(LOAD_ERROR){
    app.append(el("div",{class:"panel"}, el("h2",{},"Material nicht gefunden"), el("p",{},LOAD_ERROR),
      el("p",{class:"muted"},"Prüfen Sie, ob die Datei im Ordner „materialien“ liegt und genauso heißt wie die ID im Link.")));
    return;
  }
  if(!DATA){
    if(v==="lehrkraft"){ app.append(el("h1",{style:"font-size:1.6rem;margin-top:0"},"Lehrkraftansicht"), ladenPanel()); return; }
    app.append(el("h1",{style:"font-size:1.6rem;margin-top:0"},"Noch kein Material"),
      el("section",{class:"panel"}, el("p",{style:"margin-top:0"},"Für diese Seite ist noch kein Material geladen. Öffnen Sie den Link mit der Material-ID (…/index.html?id=…) oder fügen Sie das Material in der Lehrkraftansicht ein."),
        el("a",{class:"btn",href:"#lehrkraft"},"Zur Lehrkraftansicht")));
    return;
  }
  const sv = DATA.meta && DATA.meta.schema_version;
  if(sv!=="0.8" && v!=="lehrkraft"){
    app.append(el("div",{class:"panel"}, el("h2",{},"Material passt nicht zu dieser Seite"),
      el("p",{},"Diese Seite zeigt Material im Schema 0.8 (Sachtext). Das geladene Material hat das Schema "+(sv||"ohne Angabe")+"."),
      el("a",{class:"btn",href:"#lehrkraft"},"Zur Lehrkraftansicht")));
    return;
  }
  try{
    if(v==="tablet") renderTablet(app);
    else if(v==="lehrkraft") renderLehrkraft(app);
    else if(v==="suchkarte") renderSuchkarte(app);
    else renderKlasse(app);
  }catch(err){
    app.innerHTML="";
    app.append(el("div",{class:"panel"}, el("h2",{},"Die Seite kann nicht dargestellt werden"),
      el("p",{},"Das Material passt nicht zum Schema 0.8: "+err.message+"."),
      el("a",{class:"btn",href:"#lehrkraft"},"Zur Lehrkraftansicht")));
  }
}
async function init(){
  if(MATERIAL_ID){
    if(!/^[A-Za-z0-9_-]{1,40}$/.test(MATERIAL_ID)) LOAD_ERROR="Die Material-ID im Link ist ungültig. Erlaubt sind Buchstaben, Ziffern, - und _.";
    else{
      try{
        const r = await fetch("materialien/"+MATERIAL_ID+".json",{cache:"no-store"});
        if(!r.ok) throw new Error("Die Datei materialien/"+MATERIAL_ID+".json wurde nicht gefunden (Status "+r.status+").");
        const d = await r.json();
        if(!d.rahmen||!d.generiert) throw new Error("Die Datei enthält nicht die Bereiche „rahmen“ und „generiert“.");
        DATA = d;
        LG_ID = MATERIAL_ID;
        try{ const rl = await fetch("lerngruppen/"+MATERIAL_ID+".json",{cache:"no-store"}); if(rl.ok) LG = await rl.json(); }catch(e){ LG = null; }
      }catch(err){ LOAD_ERROR = err.message || "Die Inhalte konnten nicht geladen werden."; }
    }
  }else{ DATA = localData(); if(DATA) await ladeLerngruppe(DATA); }
  try{ const rp = await fetch("assets/pictos/liste.json",{cache:"no-store"}); if(rp.ok){ const pl = await rp.json(); PICTOS = (pl.pictos||[]).map(p=>p.id); } }catch(e){}
  loadEdits(); loadState();
  await ladeInterview();
  if(DATA) await pruefePictoDateien();
  window.addEventListener("hashchange", render);
  render();
}
init();
</script>
