<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Material-Seite</title>
<script src="assets/qrcode.min.js"></script>
<style>
@font-face{font-family:"Source Sans 3";src:url("assets/fonts/source-sans-3-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Source Sans 3";src:url("assets/fonts/source-sans-3-latin-700-normal.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{
  --paper:#F5F8F2; --surface:#FFFFFF; --ink:#1F2A1F; --muted:#56665A; --line:#D5DDD0;
  --moss:#3E6B48; --moss-ink:#FFFFFF; --bark:#6B4E31; --sun:#F4D58D;
  --opt-a:#F6E3A1; --opt-a-line:#D9B94A; --opt-b:#CFE3D1; --opt-b-line:#7FAE88;
  --ok:#2E7D4F; --bad:#B23A3A;
  --radius-lg:22px; --radius-sm:10px;
  --font:"Source Sans 3","Verdana","Tahoma",system-ui,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141A15; --surface:#1C241D; --ink:#E8EFE6; --muted:#A6B5A8; --line:#2F3A30;
    --moss:#8CC09A; --moss-ink:#102014; --bark:#C9A27A; --sun:#6B5A28;
    --opt-a:#4A3F1C; --opt-a-line:#9C8436; --opt-b:#21392A; --opt-b-line:#4E7C5A;
    --ok:#7CCB98; --bad:#E58A8A;
  }
}
:root[data-theme="dark"]{
  --paper:#141A15; --surface:#1C241D; --ink:#E8EFE6; --muted:#A6B5A8; --line:#2F3A30;
  --moss:#8CC09A; --moss-ink:#102014; --bark:#C9A27A; --sun:#6B5A28;
  --opt-a:#4A3F1C; --opt-a-line:#9C8436; --opt-b:#21392A; --opt-b-line:#4E7C5A;
  --ok:#7CCB98; --bad:#E58A8A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--moss);outline-offset:3px}
img,svg{max-width:100%}
body.kid .topnav{display:none}

.topnav{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--line);background:var(--surface)}
.topnav .title{font-weight:700;margin-right:auto;color:var(--muted);font-size:.95rem}
.topnav a{color:var(--ink);text-decoration:none;padding:.35rem .8rem;border-radius:999px;font-size:.95rem}
.topnav a[aria-current="page"]{background:var(--moss);color:var(--moss-ink)}
main{max-width:1100px;margin:0 auto;padding:1.5rem 1rem 3rem}

.btn{text-decoration:none;display:inline-flex;align-items:center;gap:.5rem;border:2px solid var(--moss);background:var(--surface);color:var(--ink);padding:.55rem 1.1rem;border-radius:999px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--moss);color:var(--moss-ink)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.figure-badge{display:inline-grid;place-items:center;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--moss);color:var(--moss-ink);font-weight:700;font-size:1.2rem;flex:none}

/* Whiteboard */
.wb-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.25rem}
.stepper{display:flex;gap:.5rem;flex-wrap:wrap}
.stepper button{border:none;background:none;padding:.3rem .2rem;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-size:1rem}
.stepper button[aria-current="step"]{color:var(--ink);border-color:var(--moss);font-weight:700}
.pack-widget{display:flex;align-items:center;gap:.6rem;flex:none}
.pack-widget .count{font-size:1rem;color:var(--muted)}
.pack-widget img{height:130px;width:auto;display:block;transition:transform .25s}
.pack-widget.bump img{transform:scale(1.06)}
.stage{min-height:52vh}
.stage-nav{display:flex;justify-content:space-between;margin-top:1.5rem}
.letter{background:#FFFDF7;color:#1F2A1F;border:1px solid #D8CBB0;border-top:8px solid var(--moss);border-radius:6px;padding:2rem 2.2rem;max-width:62ch;box-shadow:0 1px 0 #E6DCC4,0 10px 24px rgba(40,50,30,.08)}
.letter .head{display:flex;gap:1rem;align-items:center;margin-bottom:1rem}
.letter p{font-size:1.6rem;line-height:1.55;margin:0}
.lead{font-size:1.5rem;margin:0 0 1rem}

.peek{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.2rem}
.peek-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column}
.peek-card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--paper)}
.peek-card .noimg{aspect-ratio:16/10;display:grid;place-items:center;font-size:5rem;background:var(--paper)}
.peek-body{padding:1rem 1.2rem 1.2rem;display:flex;flex-direction:column;gap:.7rem}
.peek-body .q{font-size:1.4rem;line-height:1.45;margin:0;display:flex;gap:.7rem;align-items:flex-start}
.peek-body .q .figure-badge{width:2.4rem;height:2.4rem;font-size:.9rem}
.guess-form{display:flex;gap:.5rem}
.guess-form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:.5rem 1rem;background:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--opt-b);border:1px solid var(--opt-b-line);border-radius:999px;padding:.2rem .4rem .2rem .8rem;font-size:1rem}
.chip button{border:none;background:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:.1rem .3rem;color:var(--muted)}
.flying{position:fixed;z-index:50;pointer-events:none;background:var(--sun);border:1px solid var(--opt-a-line);border-radius:999px;padding:.2rem .7rem;font-size:1rem;white-space:nowrap}

.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.level{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.2rem;text-align:center}
.level .sym{font-size:3rem;line-height:1}
.level .qr{display:grid;place-items:center;margin:.8rem auto;width:180px;height:180px;background:#fff;padding:8px;border-radius:var(--radius-sm)}
.level .qr img,.level .qr canvas{width:164px!important;height:164px!important}
.qr-fallback{font-size:.75rem;word-break:break-all;color:#333}
.tip{background:var(--surface);border-left:4px solid var(--moss);padding:.7rem 1rem;margin:0 0 1rem;font-size:1.25rem}

.pack{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.2rem 1.4rem;margin-bottom:1rem}
.pack h2{font-size:1.2rem;margin:0 0 .6rem}
.pack-row{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
.pack-row:last-child{border-bottom:none}
.pack-row .pics{font-size:1.5rem;letter-spacing:.15rem}
.counter{display:flex;align-items:center;gap:.5rem}
.counter button{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid var(--moss);background:var(--surface);cursor:pointer;font-weight:700;font-size:1.2rem}
.counter output{min-width:2ch;text-align:center;font-size:1.4rem;font-weight:700}
.sent{margin-top:1rem;border-left:4px solid var(--moss);padding:.8rem 1rem;background:var(--surface)}
@keyframes flyoff{0%{transform:translate(0,0) rotate(0)}40%{transform:translate(20vw,-4px) rotate(-2deg)}100%{transform:translate(120vw,0) rotate(0)}}
.flyoff{animation:flyoff 2.2s ease-in forwards}

/* Tablet */
.tablet{max-width:720px;margin:0 auto}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.level-tag{font-size:1.1rem;color:var(--muted);display:flex;align-items:center;gap:.5rem}
.slots{display:flex;gap:.4rem}
.slot{width:2.8rem;height:2.8rem;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-size:1.5rem;background:var(--surface)}
.slot.filled{border-style:solid;border-color:var(--moss)}
.roles{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;margin:.8rem 0 0;font-size:1.05rem}
.roles span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.2rem .8rem}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.6rem 1.8rem;margin:1rem 0}
.story p{margin:0;font-size:1.5rem;line-height:1.55}
.talk{font-size:1.2rem;margin:.2rem 0 .8rem;font-weight:700}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.choice{border-radius:var(--radius-lg);padding:1.1rem;cursor:pointer;border:3px solid;display:flex;flex-direction:column;align-items:center;gap:.4rem;font-weight:700;font-size:1.25rem;color:var(--ink);text-align:center}
.choice .pic{font-size:3rem;line-height:1}
.choice.a{background:var(--opt-a);border-color:var(--opt-a-line)}
.choice.b{background:var(--opt-b);border-color:var(--opt-b-line)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:1rem 0}
.team{border:3px solid var(--line);background:var(--surface);border-radius:var(--radius-lg);padding:1rem;font-weight:700;font-size:1.2rem;cursor:pointer}
.team[aria-pressed="true"]{border-color:var(--moss);background:var(--opt-b)}
.found{text-align:center;padding:2rem 1rem}
.found .big{font-size:6rem;line-height:1;display:inline-block}
.found p{font-size:1.6rem;margin:.6rem 0 1.2rem}
.task{background:var(--opt-a);border:3px solid var(--opt-a-line);border-radius:var(--radius-lg);padding:1.2rem 1.4rem;margin:1rem 0}
.task h2{margin:0 0 .4rem;font-size:1.2rem}
.task p{margin:0;font-size:1.4rem;line-height:1.5}
.result-pics{display:flex;gap:1rem;flex-wrap:wrap;margin:.6rem 0 1rem}
.result-pics div{background:var(--surface);border:2px solid var(--moss);border-radius:var(--radius-sm);padding:.6rem 1rem;text-align:center;min-width:7rem}
.result-pics span{display:block;font-size:2.4rem}
.todo{list-style:none;padding:0;margin:0 0 1rem;display:grid;gap:.5rem;counter-reset:todo}
.todo li{counter-increment:todo;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.6rem .9rem;font-size:1.2rem}
.todo li::before{content:counter(todo) ". ";font-weight:700;color:var(--moss)}

/* Lehrkraft */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:1.1rem 1.3rem;margin-bottom:1.2rem}
.panel h2{font-size:1.2rem;margin:0 0 .6rem}
.checks{list-style:none;padding:0;margin:0}
.checks li{padding:.15rem 0}
.checks .ok::before{content:"✓ ";color:var(--ok);font-weight:700}
.checks .bad::before{content:"✗ ";color:var(--bad);font-weight:700}
.tree{list-style:none;padding-left:0;margin:0}
.tree ul{list-style:none;padding-left:1.4rem;border-left:2px solid var(--line);margin:.3rem 0 .3rem .4rem}
.tree li{margin:.35rem 0}
.tree .opt{display:inline-block;font-weight:700;color:var(--moss);margin-right:.4rem}
.tree .end{background:var(--paper);border-radius:var(--radius-sm);padding:.4rem .7rem;display:block}
.variants{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;font-size:.9rem;margin-top:.2rem}
.variants div{background:var(--paper);padding:.4rem .5rem;border-radius:8px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);text-align:left;padding:.4rem .5rem;vertical-align:top}
textarea{width:100%;min-height:14rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;border:1px solid var(--line);border-radius:var(--radius-sm);padding:.6rem;background:var(--paper)}
input[type=text]{border:1px solid var(--line);border-radius:var(--radius-sm);padding:.5rem;background:var(--paper)}
.wide{width:100%}
.msg{margin-top:.5rem}
.msg.bad{color:var(--bad)}

/* Bibliothek */
.report{max-width:820px;margin:0 auto}
.report h1{font-size:2rem;margin:.2rem 0 .3rem;display:flex;gap:.8rem;align-items:center}
.guess-group{display:grid;grid-template-columns:140px 1fr;gap:1rem;align-items:start;padding:.6rem 0;border-bottom:1px solid var(--line)}
.guess-group img,.guess-group .noimg{width:140px;aspect-ratio:16/10;object-fit:cover;border-radius:8px;background:var(--paper);display:grid;place-items:center;font-size:2.4rem}

/* Suchkarte */
.card{background:#fff;color:#1F2A1F;border:2px dashed #7FAE88;border-radius:var(--radius-sm);padding:1.4rem 1.6rem;max-width:760px;margin:0 auto 1.5rem}
.card h2{margin:0 0 .4rem;font-size:1.5rem}
.card .line{border-bottom:2px solid #9AA89C;min-height:2rem;margin:.3rem 0 .9rem}
.card .pair{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:.5rem 0}
.card .box{display:flex;align-items:center;gap:.6rem;border:2px solid #D5DDD0;border-radius:var(--radius-sm);padding:.5rem .7rem;font-size:1.15rem}
.card .sq{width:1.6rem;height:1.6rem;border:2px solid #1F2A1F;border-radius:4px;flex:none;display:inline-block}
.card .box .pic{font-size:1.8rem}
.card .box img.pic{width:4.2rem;height:4.2rem;object-fit:contain;flex:none}
.card .syms{display:flex;gap:1.2rem;font-size:1.15rem;align-items:center;flex-wrap:wrap}
.card .predict{border:2px solid #D5DDD0;border-radius:var(--radius-sm);min-height:9rem;margin:.4rem 0 .3rem}
.card .legend{font-size:.95rem;color:#56665A}
.card .mini-qr{display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap}
.card .mini-qr div{text-align:center;font-size:.85rem}
.card .mini-qr .qr{width:84px;height:84px;display:grid;place-items:center}
.card .mini-qr .qr img,.card .mini-qr .qr canvas{width:80px!important;height:80px!important}
.card .smileys{display:flex;gap:1.5rem;font-size:2.4rem;margin-bottom:.6rem}

.figure-badge.bild{background:none;width:3.6rem;height:3.6rem;overflow:hidden}
.figure-badge.bild img{width:100%;height:100%;display:block}
.brief-bild{width:6.5rem;height:auto;flex:none}
.bubble{display:flex;gap:.8rem;align-items:center;background:var(--surface);border:2px solid var(--moss);border-radius:var(--radius-lg);padding:.9rem 1.2rem;font-size:1.4rem;margin:0 0 1rem}
.plus-btn{width:2.8rem;height:2.8rem;border-radius:50%;border:2px solid var(--moss);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:700;font-size:1.5rem;line-height:1;flex:none}
img.pm{height:2.2rem;width:auto;vertical-align:middle;display:inline-block}
.card img.pm{height:2.2rem}
.result-pics img.pm{height:3.4rem}
.pack-row .pics img.pm{height:2rem}
.lizenz{font-size:.85rem;color:var(--muted);max-width:1100px;margin:0 auto;padding:0 1rem 2rem}
.lizenz a{color:var(--muted)}
body.kid .lizenz{display:none}
@media print{
  .topnav,.no-print{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0}
  .card{page-break-after:always;border-color:#999}
  .report .panel{border-color:#999}
}
@media (max-width:640px){
  .choices,.teams{grid-template-columns:1fr}
  .letter{padding:1.3rem}
  .letter p,.lead{font-size:1.3rem}
  .story p{font-size:1.3rem}
  .story{padding:1.1rem 1.2rem}
  .variants{grid-template-columns:1fr}
  .wb-head{flex-direction:column}
  .guess-group{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .pack-widget img{transition:none}
  .flyoff{animation:none}
}
</style>
</head>

<nav class="topnav no-print" aria-label="Ansichten">
  <span class="title">Material-Seite (Prototyp)</span>

<script>
// ===== Festes im Template (T) =====
const FIGUR = "Frido";
const FIGUR_KOPF = "assets/biber/biber-kopf.svg";

const FIGUR_PACKT = "assets/biber/biber-packt.svg";
const FRAGE_BIBLIOTHEK = "Was kann man in der Bibliothek erleben?";
const MERKMALE = [
  [{key:"lustig", label:"lustig", img:"lustig.png", pic:"😄"}, {key:"spannend", label:"spannend", img:"spannend.png", pic:"😮"}],
  [{key:"tier", label:"Tier", img:"tier.png", pic:"🦔"}, {key:"kind", label:"Kind", img:"kind.png", pic:"🧒"}],
  [{key:"bilder", label:"viele Bilder", img:"bilder.png", pic:"🖼️"}, {key:"text", label:"viel Text", img:"text.png", pic:"📖"}]
];
const STUFEN = {1:{name:"Blatt", sym:"🍃"}, 2:{name:"Baum", sym:"🌳"}, 3:{name:"Wald", sym:"🌲"}};
const VORHERSAGE = "Zeichnet oder schreibt ein Stichwort: Worum geht es wohl in eurem Buch?";
const KNOTEN_IDS = ["S","A","B","AA","AB","BA","BB"];
const ENDEN_IDS = ["AAA","AAB","ABA","ABB","BAA","BAB","BBA","BBB"];
const LIM_TEXT = {stufe1:80, stufe2:150, stufe3:250};

// ===== Speicher (nur dieser Browser) =====
function store(key, val){
  try{
    if(val===undefined) return localStorage.getItem(key);
    if(val===null) localStorage.removeItem(key); else localStorage.setItem(key,val);
  }catch(e){ return null; }
}

// ===== Daten laden =====
const MATERIAL_ID = new URLSearchParams(location.search).get("id");
let DATA = null, LOAD_ERROR = "";
function localData(){
  const raw = store("ms_json");
  if(raw){ try{ const d = JSON.parse(raw); if(d && d.rahmen && d.generiert) return d; }catch(e){} }
  return BEISPIEL;
}
const G = () => DATA.generiert;
const R = () => DATA.rahmen;

const STATE_KEY = "ms_state_" + (MATERIAL_ID || "lokal");
function emptyState(){ return {vermutungen:[], counts:Object.fromEntries(ENDEN_IDS.map(id=>[id,0])), gesendet:false}; }
let WB = emptyState();
function loadState(){
  try{ const s = JSON.parse(store(STATE_KEY)||"null"); if(s && s.counts && Array.isArray(s.vermutungen)) WB = Object.assign(emptyState(), s); }catch(e){}
}
function saveState(){ store(STATE_KEY, JSON.stringify(WB)); }
function packCount(){ return WB.vermutungen.length + Object.values(WB.counts).reduce((a,b)=>a+b,0); }

// ===== Hilfsfunktionen =====
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class") n.className=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if(v!==false && v!=null) n.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; n.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return n;
}
const reduceMotion = () => { try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } };
function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang="de-DE"; u.rate=0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function readBtn(getText){ return el("button",{class:"btn",type:"button",onclick:()=>speak(getText())},"🔊 Vorlesen"); }
function baseUrl(){ return store("ms_base") || location.href.split("#")[0]; }
function tabletUrl(n){ return baseUrl() + "#tablet-" + n; }
function qr(container, text, size){
  try{
    if(typeof QRCode==="undefined") throw new Error("no lib");
    new QRCode(container,{text, width:size, height:size, correctLevel:QRCode.CorrectLevel.M});
  }catch(e){ container.append(el("span",{class:"qr-fallback"}, text)); }
}
function merkmale(path){ return path.split("").map((c,i)=>MERKMALE[i][c==="A"?0:1]); }
function picNode(m, cls){
  const c = cls||"pm";
  return m.img ? el("img",{class:c, src:"assets/pictos/"+m.img, alt:"", "aria-hidden":"true"}) : el("span",{class:c,"aria-hidden":"true"}, m.pic);
}
function figBadge(){ return el("span",{class:"figure-badge bild","aria-hidden":"true"}, el("img",{src:FIGUR_KOPF,alt:""})); }
function bild(i){ const b = R().bilder; return (Array.isArray(b) && Number.isInteger(i) && b[i]) ? b[i] : null; }
function libSymbol(){ return el("div",{class:"noimg","aria-hidden":"true"},"🏛️"); }
function imgOrSymbol(i){
  const b = bild(i);
  return b ? el("img",{src:b.datei, alt:b.beschreibung||("Bild der "+R().bibliothek)}) : libSymbol();
}

// Rucksack-Symbol
function packSvg(n){
  const fill = Math.min(n,10)/10;
  const h = 46*fill;
  return `<svg viewBox="0 0 64 72" aria-hidden="true">
    <path d="M20 14 C20 4 44 4 44 14" fill="none" stroke="#B8401F" stroke-width="4"/>
    <rect x="8" y="14" width="48" height="54" rx="14" fill="#E4572E" stroke="#B8401F" stroke-width="4"/>
    <clipPath id="pc"><rect x="10" y="16" width="44" height="50" rx="12"/></clipPath>
    <path d="M10 24 C18 14 46 14 54 24 L54 36 L10 36 Z" fill="#2E8C8C" clip-path="url(#pc)"/>
    <rect clip-path="url(#pc)" x="10" y="${66-h}" width="44" height="${h}" fill="#F2C14E" opacity=".85"/>
    <rect x="20" y="40" width="24" height="16" rx="5" fill="#F2C14E" stroke="#B8401F" stroke-width="3"/>
  </svg>`;
}
function packImg(){ return `<img src="${FIGUR_PACKT}" alt="" style="height:130px;width:auto;display:block">`; }
function packWidget(){
  if(WB.gesendet) return el("div",{class:"pack-widget"}, el("span",{class:"count"}, FIGUR+" ist mit dem Rucksack unterwegs"));
  const w = el("div",{class:"pack-widget",id:"pack","aria-live":"polite"});
  w.innerHTML = packImg();
  w.append(el("span",{class:"count"}, FIGUR+"s Rucksack: "+packCount()));
  return w;
}
function refreshPack(){
  const w = document.getElementById("pack"); if(!w) return;
  w.innerHTML = packImg();
  w.append(el("span",{class:"count"}, FIGUR+"s Rucksack: "+packCount()));
  if(!reduceMotion()){ w.classList.add("bump"); setTimeout(()=>w.classList.remove("bump"),260); }
}
function flyToPack(fromEl, label){
  const target = document.getElementById("pack");
  if(!target || !fromEl || reduceMotion() || !document.body.animate){ refreshPack(); return; }
  const a = fromEl.getBoundingClientRect(), b = target.getBoundingClientRect();
  const f = el("div",{class:"flying"}, label);
  f.style.left = a.left+"px"; f.style.top = a.top+"px";
  document.body.append(f);
  const dx = (b.left+b.width/2) - (a.left+20), dy = (b.top+b.height/2) - (a.top+10);
  f.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.3)`,opacity:.3}],{duration:700,easing:"ease-in"})
   .onfinish = ()=>{ f.remove(); refreshPack(); };
}

let slide = 0;
function steps(){
  const s = ["Brief"];
  if(Array.isArray(G().bibliotheksblick) && G().bibliotheksblick.length) s.push("Bibliothek");
  s.push("Geschichte","Rucksack");
  return s;
}
function renderKlasse(app){
  const S = steps(); if(slide>=S.length) slide=S.length-1;
  const head = el("div",{class:"wb-head"},
    el("div",{class:"stepper"}, S.map((name,i)=>el("button",{type:"button","aria-current":i===slide?"step":false,onclick:()=>{slide=i;render();}},name))),
    packWidget());
  const stage = el("section",{class:"stage"});
  const name = S[slide];
  if(name==="Brief") stage.append(slideBrief());
  if(name==="Bibliothek") stage.append(slideBibliothek());
  if(name==="Geschichte") stage.append(slideGeschichte());
  if(name==="Rucksack") stage.append(slideRucksack());
  const nav = el("div",{class:"stage-nav"},
    el("button",{class:"btn",type:"button",disabled:slide===0,onclick:()=>{slide--;render();}},"Zurück"),
    el("button",{class:"btn primary",type:"button",disabled:slide===S.length-1,onclick:()=>{slide++;render();}},"Weiter"));
  app.append(head, stage, nav);
}

function payload(){
  const o = {k:R().klasse, p:R().programmtitel, b:R().bibliothek, s:{}, v:WB.vermutungen.map(x=>[x.bild==null?-1:x.bild, x.text])};
  ENDEN_IDS.forEach(id=>{ if(WB.counts[id]>0) o.s[id]=WB.counts[id]; });
  const bytes = new TextEncoder().encode(JSON.stringify(o));
  let bin=""; bytes.forEach(c=>bin+=String.fromCharCode(c));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unpayload(s){
  const b64 = s.replace(/-/g,"+").replace(/_/g,"/");
  const bin = atob(b64); const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

function validate(d){
  const res=[]; const add=(ok,t)=>res.push({ok,t});
  const g=d.generiert||{}, r=d.rahmen||{};
  add(!!(r.klasse&&r.bibliothek&&r.programmtitel),"Rahmendaten vollständig (Klasse, Bibliothek, Programmtitel)");
  if(r.bilder!=null) add(Array.isArray(r.bilder)&&r.bilder.every(b=>b&&b.datei&&b.beschreibung),"Jedes Bild hat Datei und Beschreibung");
  add(!!(g.brief&&g.brief.text)&&g.brief.text.length<=500,"Brief vorhanden, max. 500 Zeichen"+(g.brief&&g.brief.text?" ("+g.brief.text.length+")":""));
  const bb = g.bibliotheksblick;
  if(bb!=null) add(Array.isArray(bb)&&bb.length===1&&bb.every(x=>x&&Number.isInteger(x.bild)&&(r.bilder||[])[x.bild]),"Blick in die Bibliothek: genau 1 Bild (Frage ist fest im Template)");
  add(Array.isArray(g.teamnamen)&&g.teamnamen.length>=2&&g.teamnamen.every(n=>typeof n==="string"&&n.length<=30),"2 oder mehr Teamnamen, max. 30 Zeichen");
  const k=(g.geschichte&&g.geschichte.knoten)||{}, e=(g.geschichte&&g.geschichte.enden)||{};
  const mk=KNOTEN_IDS.filter(id=>!k[id]); add(!mk.length,"Alle 7 Knoten vorhanden"+(mk.length?" (fehlt: "+mk.join(", ")+")":""));
  const me=ENDEN_IDS.filter(id=>!e[id]); add(!me.length,"Alle 8 Enden vorhanden"+(me.length?" (fehlt: "+me.join(", ")+")":""));
  const miss=[], long=[], badOpt=[];
  KNOTEN_IDS.forEach(id=>{ const n=k[id]; if(!n) return;
    Object.keys(LIM_TEXT).forEach(s=>{ const t=n.text&&n.text[s]; if(!t) miss.push(id+"/"+s); else if(t.length>LIM_TEXT[s]) long.push(id+"/"+s+" ("+t.length+")"); });
    if(!Array.isArray(n.optionen)||n.optionen.length!==2) badOpt.push(id);
    else n.optionen.forEach((o,i)=>{
      Object.keys(LIM_TEXT).forEach(s=>{ const t=o.label&&o.label[s]; if(!t) miss.push(id+"/Option"+(i+1)+"/"+s); else if(t.length>40) long.push(id+"/Option"+(i+1)+"/"+s+" ("+t.length+")"); });
      if(!o.fund||!o.fund.name) miss.push(id+"/Option"+(i+1)+"/Fund"); else if(o.fund.name.length>25) long.push(id+"/Fund ("+o.fund.name.length+")");
    });
  });
  ENDEN_IDS.forEach(id=>{ const n=e[id]; if(!n) return;
    Object.keys(LIM_TEXT).forEach(s=>{ const t=n.text&&n.text[s]; if(!t) miss.push(id+"/"+s); else if(t.length>LIM_TEXT[s]) long.push(id+"/"+s+" ("+t.length+")"); });
    Object.keys(LIM_AUFTRAG).forEach(s=>{ const t=n.suchauftrag&&n.suchauftrag[s]; if(!t) miss.push(id+"/Suchauftrag/"+s); else if(t.length>LIM_AUFTRAG[s]) long.push(id+"/Suchauftrag/"+s+" ("+t.length+")"); });
  });
  const cut=a=>a.slice(0,6).join(", ")+(a.length>6?" …":"");
  add(!miss.length,"Alle Texte, Optionen und Fundstücke in drei Stufen"+(miss.length?" (fehlt: "+cut(miss)+")":""));
  add(!badOpt.length,"Jeder Knoten hat genau zwei Optionen"+(badOpt.length?" (Fehler: "+badOpt.join(", ")+")":""));
  add(!long.length,"Längengrenzen eingehalten"+(long.length?" – zu lang: "+cut(long):""));
  add(typeof g.absenden_text==="string"&&g.absenden_text.length>0&&g.absenden_text.length<=200,"Absendetext vorhanden, max. 200 Zeichen");
  add(Array.isArray(g.luecken),"Lückenliste vorhanden");
  return res;
}

  app.append(el("section",{class:"panel"}, el("h2",{},"Automatische Prüfung"), el("ul",{class:"checks"}, validate(DATA).map(c=>el("li",{class:c.ok?"ok":"bad"},c.t)))));
  app.append(el("section",{class:"panel"}, el("h2",{},"Herkunft"),
    el("p",{style:"margin:0"},"Erzeugt von: "+(meta.erzeugt_von||"keine Angabe")+". Prompt-Version: "+(meta.prompt_version||"keine Angabe")+". Datum: "+(meta.erzeugt_am||"keine Angabe")+"."),
    meta.hinweis ? el("p",{class:"muted",style:"margin:.4rem 0 0"}, meta.hinweis) : null));
  if(Array.isArray(g.bibliotheksblick)&&g.bibliotheksblick.length){
    app.append(el("section",{class:"panel"}, el("h2",{},"Blick in die Bibliothek"),
      el("ul",{style:"margin:0"}, g.bibliotheksblick.map(b=>{ const bi=bild(b.bild); return el("li",{}, (bi?(bi.ort||bi.beschreibung):"ohne Bild")+": "+FRAGE_BIBLIOTHEK); }))));
  }
  app.append(el("section",{class:"panel"}, el("h2",{},"Teamnamen"), el("p",{style:"margin:0"}, (g.teamnamen||[]).join(", ")||"keine")));
  const zu = el("table",{}, el("thead",{}, el("tr",{}, el("th",{},"Entscheidung"), el("th",{},"Linke Antwort steht für"), el("th",{},"Rechte Antwort steht für"))),
    el("tbody",{}, MERKMALE.map((p,i)=>el("tr",{}, el("td",{},String(i+1)), el("td",{},picNode(p[0]), " "+p[0].label), el("td",{},picNode(p[1]), " "+p[1].label)))));
  app.append(el("section",{class:"panel"}, el("h2",{},"Zuordnung der Entscheidungen"), el("div",{class:"table-wrap"},zu)));
  const q=[["Brief",g.brief&&g.brief.quellen],["Geschichte ("+(g.geschichte&&g.geschichte.kulisse)+")",g.geschichte&&g.geschichte.kulisse_quellen],["Piktogramme",["ARASAAC (arasaac.org), CC BY-NC-SA 4.0"]],["Figur Frido",["eigene Zeichnung"]]];
  app.append(el("section",{class:"panel"}, el("h2",{},"Quellen"), el("ul",{style:"margin:0"}, q.map(([n,s])=>el("li",{}, n+": "+((s&&s.length)?s.join(", "):"keine Angabe"))))));
  let alle = store("ms_alle")==="1";
  app.append(el("section",{class:"panel"}, el("h2",{},"Geschichte prüfen (Stufe 2)"),
    el("label",{class:"row",style:"margin-bottom:.6rem"}, el("input",{type:"checkbox",checked:alle,onchange:ev=>{ store("ms_alle",ev.target.checked?"1":"0"); render(); }}),"Alle drei Stufen nebeneinander zeigen"),
    buildTree("",alle)));
  const ta = el("textarea",{"aria-label":"JSON der Material-Seite",spellcheck:"false"}); ta.value = JSON.stringify(DATA,null,2);
  const msg = el("div",{class:"msg"});
  app.append(el("section",{class:"panel"}, el("h2",{},"Inhalte laden"),
    el("p",{style:"margin-top:0"}, MATERIAL_ID ? "Dieses Material stammt aus der Datei materialien/"+MATERIAL_ID+".json. Hier eingefügtes JSON gilt nur zum Ausprobieren und wird nicht gespeichert." : "Fügen Sie hier das JSON ein, das das Sprachmodell erzeugt hat. Es wird nur in diesem Browser gespeichert."),
    ta,
    el("div",{class:"row",style:"margin-top:.6rem"},
      el("button",{class:"btn primary",type:"button",onclick:()=>{
        try{ const d=JSON.parse(ta.value); if(!d.rahmen||!d.generiert) throw new Error("Die Bereiche „rahmen“ und „generiert“ fehlen.");
          DATA=d; if(!MATERIAL_ID) store("ms_json",JSON.stringify(d)); render(); }
        catch(err){ msg.className="msg bad"; msg.textContent="Nicht geladen: "+err.message; } }},"JSON laden"),
      el("button",{class:"btn",type:"button",onclick:()=>{ if(MATERIAL_ID) location.reload(); else { DATA=BEISPIEL; store("ms_json",null); render(); } }}, MATERIAL_ID?"Gespeichertes Material neu laden":"Beispiel wiederherstellen")),
    msg));
  const bu = el("input",{type:"text",class:"wide",value:baseUrl()});
  app.append(el("section",{class:"panel"}, el("h2",{},"Adresse für die QR-Codes"),
    el("p",{style:"margin-top:0"},"Die QR-Codes führen zu dieser Adresse. Normalerweise müssen Sie hier nichts ändern."),
    bu, el("div",{class:"row",style:"margin-top:.6rem"}, el("button",{class:"btn",type:"button",onclick:()=>{ store("ms_base",bu.value.trim()||null); render(); }},"Adresse übernehmen"))));
}
function buildTree(path, alle){
  const g=G().geschichte;
  const show = obj => alle ? el("div",{class:"variants"}, [1,2,3].map(n=>el("div",{}, STUFEN[n].sym+" ", obj["stufe"+n]))) : el("span",{}, obj.stufe2);
  if(path.length===3){
    const e=g.enden[path];
    return el("div",{class:"end"}, show(e.text), el("div",{style:"margin-top:.3rem"}, el("strong",{},"Suchauftrag: "), show(e.suchauftrag)));
  }
  const k=g.knoten[path===""?"S":path];
  const ul=el("ul",{class:path===""?"tree":""});
  const li=el("li",{}, show(k.text));
  const sub=el("ul",{});
  ["A","B"].forEach((c,i)=>{ const o=k.optionen[i], m=MERKMALE[path.length][i];
    sub.append(el("li",{},
      el("span",{class:"opt"}, (o.symbol?o.symbol+" ":"")+o.label.stufe2),
      el("span",{class:"muted",style:"font-size:.9rem"}, "Merkmal: "+m.label+". Fund: "+(o.fund?(o.fund.symbol||"")+" "+o.fund.name:"–")),
      buildTree(path+c, alle)));
  });
  li.append(sub); ul.append(li); return ul;
}

// ===== Router =====
function currentView(){
  const h = location.hash.replace("#","");
  if(h.startsWith("bibliothek=")) return {view:"bibliothek", raw:h.slice(11)};
  const m = /^tablet-(\d)$/.exec(h);
  if(m && STUFEN[m[1]]) return {view:"tablet", stufe:Number(m[1])};
  if(h==="lehrkraft") return {view:"lehrkraft"};
  if(h==="suchkarte") return {view:"suchkarte"};
  return {view:"klasse"};
}
function render(){
  try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){}
  const app=document.getElementById("app"); app.innerHTML="";
  const v=currentView();
  document.body.classList.toggle("kid", v.view==="tablet"||v.view==="bibliothek");
  document.querySelectorAll(".topnav a").forEach(a=>a.setAttribute("aria-current", a.dataset.view===v.view?"page":"false"));
  if(LOAD_ERROR){
    app.append(el("div",{class:"panel"}, el("h2",{},"Material nicht gefunden"), el("p",{},LOAD_ERROR),
      el("p",{class:"muted"},"Prüfen Sie, ob die Datei im Ordner „materialien“ liegt und genauso heißt wie die ID im Link.")));
    return;
  }
  try{
    if(v.view==="tablet") renderTablet(app, v.stufe);
    else if(v.view==="bibliothek") renderBibliothek(app, v.raw);
    else if(v.view==="lehrkraft") renderLehrkraft(app);
    else if(v.view==="suchkarte") renderSuchkarte(app);
    else renderKlasse(app);
  }catch(err){
    app.innerHTML="";
    app.append(el("div",{class:"panel"}, el("h2",{},"Die Seite kann nicht dargestellt werden"),
      el("p",{},"Das Material passt nicht zum Schema: "+err.message+"."),
      el("a",{class:"btn",href:"#lehrkraft"},"Zur Lehrkraftansicht")));
  }
}
async function init(){
  if(MATERIAL_ID){
    if(!/^[A-Za-z0-9_-]{1,40}$/.test(MATERIAL_ID)) LOAD_ERROR="Die Material-ID im Link ist ungültig. Erlaubt sind Buchstaben, Ziffern, - und _.";
    else{
      try{
        const r = await fetch("materialien/"+MATERIAL_ID+".json",{cache:"no-store"});
        if(!r.ok) throw new Error("Die Datei materialien/"+MATERIAL_ID+".json wurde nicht gefunden (Status "+r.status+").");
        const d = await r.json();
        if(!d.rahmen||!d.generiert) throw new Error("Die Datei enthält nicht die Bereiche „rahmen“ und „generiert“.");
        DATA = d;
      }catch(err){ LOAD_ERROR = err.message || "Die Inhalte konnten nicht geladen werden."; }
    }
  }else DATA = localData();
  loadState();
  window.addEventListener("hashchange", render);
  render();
}
init();
</script>
