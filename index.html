<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Material-Seite – Testvorlage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --paper:#F5F8F2; --surface:#FFFFFF; --ink:#1F2A1F; --muted:#56665A; --line:#D5DDD0;
  --moss:#3E6B48; --moss-ink:#FFFFFF; --bark:#6B4E31;
  --opt-a:#F6E3A1; --opt-a-line:#D9B94A; --opt-b:#CFE3D1; --opt-b-line:#7FAE88;
  --ok:#2E7D4F; --bad:#B23A3A;
  --radius-lg:22px; --radius-sm:10px;
  --font:"Andika","Verdana","Tahoma",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141A15; --surface:#1C241D; --ink:#E8EFE6; --muted:#A6B5A8; --line:#2F3A30;
    --moss:#8CC09A; --moss-ink:#102014; --bark:#C9A27A;
    --opt-a:#4A3F1C; --opt-a-line:#9C8436; --opt-b:#21392A; --opt-b-line:#4E7C5A;
    --ok:#7CCB98; --bad:#E58A8A;
  }
}
:root[data-theme="dark"]{
  --paper:#141A15; --surface:#1C241D; --ink:#E8EFE6; --muted:#A6B5A8; --line:#2F3A30;
  --moss:#8CC09A; --moss-ink:#102014; --bark:#C9A27A;
  --opt-a:#4A3F1C; --opt-a-line:#9C8436; --opt-b:#21392A; --opt-b-line:#4E7C5A;
  --ok:#7CCB98; --bad:#E58A8A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--moss);outline-offset:3px}
img,svg{max-width:100%}

/* Navigation (nur für den Test) */
.topnav{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--line);background:var(--surface)}
.topnav .title{font-weight:700;margin-right:auto;color:var(--muted);font-size:.95rem}
.topnav a{color:var(--ink);text-decoration:none;padding:.35rem .8rem;border-radius:999px;font-size:.95rem}
.topnav a[aria-current="page"]{background:var(--moss);color:var(--moss-ink)}
main{max-width:1100px;margin:0 auto;padding:1.5rem 1rem 3rem}

/* Allgemeine Elemente */
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:.5rem;border:2px solid var(--moss);background:var(--surface);color:var(--ink);padding:.55rem 1.1rem;border-radius:999px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--moss);color:var(--moss-ink)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.figure-badge{display:inline-grid;place-items:center;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--moss);color:var(--moss-ink);font-weight:700;font-size:1.2rem;flex:none}

/* Klassenmodus */
.stepper{display:flex;gap:.5rem;margin-bottom:1.25rem;flex-wrap:wrap}
.stepper button{border:none;background:none;padding:.3rem .2rem;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-size:1rem}
.stepper button[aria-current="step"]{color:var(--ink);border-color:var(--moss);font-weight:700}
.stage{min-height:52vh}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:2rem 2.2rem;max-width:62ch}
.letter .head{display:flex;gap:1rem;align-items:center;margin-bottom:1rem}
.letter p{font-size:1.65rem;line-height:1.55;margin:0}
.stage-nav{display:flex;justify-content:space-between;margin-top:1.5rem}

.way svg{width:100%;height:auto;max-height:50vh;display:block}
.way .caption{font-size:1.6rem;margin-top:.75rem}
@keyframes fly{from{offset-distance:0%}to{offset-distance:100%}}
.flyer{offset-path:path("M150 230 C 330 40, 620 40, 800 230");offset-rotate:0deg;animation:fly 3.2s ease-in-out .4s both}
@media (prefers-reduced-motion:reduce){.flyer{animation:none;offset-distance:100%}}

.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.level{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.2rem;text-align:center}
.level .sym{font-size:3rem;line-height:1}
.level .qr{display:grid;place-items:center;margin:.8rem auto;width:180px;height:180px;background:#fff;padding:8px;border-radius:var(--radius-sm)}
.level .qr img,.level .qr canvas{width:164px!important;height:164px!important}
.qr-fallback{font-size:.75rem;word-break:break-all;color:#333}

.pack{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.2rem 1.4rem}
.pack-row{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--line)}
.pack-row:last-child{border-bottom:none}
.pack-row .pics{font-size:1.6rem;letter-spacing:.15rem}
.counter{display:flex;align-items:center;gap:.5rem}
.counter button{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid var(--moss);background:var(--surface);cursor:pointer;font-weight:700;font-size:1.2rem}
.counter output{min-width:2ch;text-align:center;font-size:1.4rem;font-weight:700}
.sent{margin-top:1rem;border-left:4px solid var(--moss);padding:.6rem 1rem;background:var(--surface)}

/* Tabletmodus */
.tablet{max-width:720px;margin:0 auto}
.tablet .level-tag{font-size:1.1rem;color:var(--muted);display:flex;align-items:center;gap:.5rem}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.6rem 1.8rem;margin:1rem 0}
.story p{margin:0;font-size:1.5rem;line-height:1.55}
.story.s1 p{font-size:1.9rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.choice{border-radius:var(--radius-lg);padding:1.2rem;cursor:pointer;border:3px solid;display:flex;flex-direction:column;align-items:center;gap:.4rem;font-weight:700;font-size:1.3rem;color:var(--ink)}
.choice .pic{font-size:3.2rem;line-height:1}
.choice.a{background:var(--opt-a);border-color:var(--opt-a-line)}
.choice.b{background:var(--opt-b);border-color:var(--opt-b-line)}
.s1 .choice .pic{font-size:4.2rem}
.result-pics{display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0}
.result-pics div{background:var(--surface);border:2px solid var(--moss);border-radius:var(--radius-sm);padding:.6rem 1rem;text-align:center;min-width:7rem}
.result-pics span{display:block;font-size:2.4rem}

/* Lehrkraft */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:1.1rem 1.3rem;margin-bottom:1.2rem}
.panel h2{font-size:1.2rem;margin:0 0 .6rem}
.checks{list-style:none;padding:0;margin:0}
.checks li{padding:.15rem 0}
.checks .ok::before{content:"✓ ";color:var(--ok);font-weight:700}
.checks .bad::before{content:"✗ ";color:var(--bad);font-weight:700}
.tree{list-style:none;padding-left:0;margin:0}
.tree ul{list-style:none;padding-left:1.4rem;border-left:2px solid var(--line);margin:.3rem 0 .3rem .4rem}
.tree li{margin:.35rem 0}
.tree .node{font-size:.98rem}
.tree .opt{display:inline-block;font-weight:700;color:var(--moss);margin-right:.3rem}
.tree .end{background:var(--paper);border-radius:var(--radius-sm);padding:.3rem .6rem;display:inline-block}
.variants{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;font-size:.9rem;margin-top:.2rem}
.variants div{background:var(--paper);padding:.4rem .5rem;border-radius:8px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);text-align:left;padding:.4rem .5rem;vertical-align:top}
textarea{width:100%;min-height:14rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;border:1px solid var(--line);border-radius:var(--radius-sm);padding:.6rem;background:var(--paper)}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:.5rem;background:var(--paper)}
.msg{margin-top:.5rem}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}

/* Suchkarte */
.card{background:#fff;color:#1F2A1F;border:2px dashed #7FAE88;border-radius:var(--radius-sm);padding:1.4rem 1.6rem;max-width:760px;margin:0 auto 1.5rem}
.card h2{margin:0 0 .4rem;font-size:1.5rem}
.card .line{border-bottom:2px solid #9AA89C;min-height:2rem;margin:.4rem 0 1rem}
.card .pair{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:.6rem 0}
.card .box{display:flex;align-items:center;gap:.6rem;border:2px solid #D5DDD0;border-radius:var(--radius-sm);padding:.5rem .7rem;font-size:1.15rem}
.card .box .sq{width:1.6rem;height:1.6rem;border:2px solid #1F2A1F;border-radius:4px;flex:none}
.card .box .pic{font-size:1.8rem}
.card .syms{display:flex;gap:1.2rem;font-size:1.15rem;align-items:center;flex-wrap:wrap}
.card .mini-qr{display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap}
.card .mini-qr div{text-align:center;font-size:.85rem}
.card .mini-qr .qr{width:84px;height:84px;display:grid;place-items:center}
.card .mini-qr .qr img,.card .mini-qr .qr canvas{width:80px!important;height:80px!important}
.card .smileys{display:flex;gap:1.5rem;font-size:2.4rem}
@media print{
  .topnav,.no-print{display:none!important}
  body{background:#fff}
  main{padding:0}
  .card{page-break-after:always;border-color:#999}
}
@media (max-width:560px){
  .choices{grid-template-columns:1fr}
  .story p,.story.s1 p{font-size:1.25rem}
  .story{padding:1.1rem 1.2rem}
  .letter{padding:1.3rem}
  .letter p{font-size:1.3rem}
  .variants{grid-template-columns:1fr}
}
</style>
</head>

const LIMITS = {stufe1:80, stufe2:150, stufe3:250};

// ---------- Speicher (nur dieser Browser) ----------
function store(key, val){ try{ if(val===undefined) return localStorage.getItem(key); if(val===null) localStorage.removeItem(key); else localStorage.setItem(key,val);}catch(e){ return null; } }
function loadData(){
  const raw = store("ms_json");
  if(raw){ try{ const d = JSON.parse(raw); if(d && d.generiert && d.rahmen) return d; }catch(e){} }
  return BEISPIEL;
}
// Material-ID aus dem Link, z. B. ...?id=4711 -> lädt materialien/4711.json
const MATERIAL_ID = new URLSearchParams(location.search).get("id");
let DATA = MATERIAL_ID ? null : loadData();
let LOAD_ERROR = "";
const G = () => DATA.generiert;
const R = () => DATA.rahmen;

// ---------- Hilfsfunktionen ----------
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class") n.className=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if(v!==false && v!=null) n.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; n.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return n;
}
function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE"; u.rate = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function readBtn(getText){ return el("button",{class:"btn", type:"button", onclick:()=>speak(getText())},"🔊 Vorlesen"); }
function baseUrl(){ return store("ms_base") || location.href.split("#")[0]; } // enthält ?id=…, damit Tablets dasselbe Material laden
function tabletUrl(n){ return baseUrl() + "#tablet-" + n; }
function qr(container, text, size){
  try{
    if(typeof QRCode === "undefined") throw new Error("no lib");
    new QRCode(container, {text, width:size, height:size, correctLevel: QRCode.CorrectLevel.M});
  }catch(e){
    container.append(el("span",{class:"qr-fallback"}, text));
  }
}
function merkmaleFuerPfad(path){ return path.split("").map((c,i)=>MERKMALE[i][c==="A"?0:1]); }

// ---------- Klassenmodus (Whiteboard) ----------
let slide = 0;
const SLIDES = ["Brief", "Weg", "Geschichte", "Rucksack"];
let counts = Object.fromEntries(ENDEN_IDS.map(id=>[id,0]));
let sentText = "";

function renderKlasse(app){
  const stepper = el("div",{class:"stepper", role:"tablist"},
    SLIDES.map((name,i)=>el("button",{type:"button","aria-current":i===slide?"step":false, onclick:()=>{slide=i;render();}}, name)));
  const stage = el("section",{class:"stage"});
  if(slide===0) stage.append(slideBrief());
  if(slide===1) stage.append(slideWeg());
  if(slide===2) stage.append(slideGeschichte());
  if(slide===3) stage.append(slideRucksack());
  const nav = el("div",{class:"stage-nav"},
    el("button",{class:"btn",type:"button",disabled:slide===0,onclick:()=>{slide--;render();}},"Zurück"),
    el("button",{class:"btn primary",type:"button",disabled:slide===SLIDES.length-1,onclick:()=>{slide++;render();}},"Weiter"));
  app.append(stepper, stage, nav);
}

function slideRucksack(){
  const box = el("div",{});
  box.append(el("p",{style:"font-size:1.5rem;margin-top:0"},"Packt "+FIGUR+"s Rucksack: Wie viele Paare haben welchen Suchauftrag?"));
  const pack = el("div",{class:"pack"});
  ENDEN_IDS.forEach(id=>{
    const m = merkmaleFuerPfad(id);
    const out = el("output",{},String(counts[id]));
    const set = d=>{ counts[id]=Math.max(0,counts[id]+d); out.textContent=counts[id]; total.textContent=sum(); };
    pack.append(el("div",{class:"pack-row"},
      el("span",{class:"pics","aria-hidden":"true"}, m.map(x=>x.pic).join(" ")),
      el("span",{}, m.map(x=>x.label).join(", ")),
      el("div",{class:"counter"},

        el("button",{type:"button","aria-label":"mehr",onclick:()=>set(1)},"+"))));
  });
  const total = el("strong",{},String(sum()));
  box.append(pack, el("p",{},"Paare insgesamt: ", total));
  const sentBox = el("div",{});
  const send = el("button",{class:"btn primary",type:"button",onclick:()=>{
    const lines = ENDEN_IDS.filter(id=>counts[id]>0).map(id=>counts[id]+"× "+merkmaleFuerPfad(id).map(x=>x.label).join(" + "));
    sentText = "Klasse "+R().klasse+", Programm „"+R().programmtitel+"“\n"+(lines.length?lines.join("\n"):"Keine Suchaufträge eingetragen.");
    render();

      el("button",{class:"btn",type:"button",onclick:()=>{ try{ navigator.clipboard.writeText(sentText); }catch(e){} }},"Text kopieren")));
    const ab = G().abschied;
    box.append(el("div",{class:"letter",style:"margin-top:1rem"},
      el("div",{class:"head"}, el("span",{class:"figure-badge","aria-hidden":"true"},FIGUR)),
      el("p",{}, ab), el("div",{class:"row",style:"margin-top:1rem"}, readBtn(()=>ab))));

  return box;
}
function sum(){ return Object.values(counts).reduce((a,b)=>a+b,0); }

// ---------- Tabletmodus ----------
let tState = {stufe:2, path:"", started:false};
function renderTablet(app, stufe){
  if(tState.stufe!==stufe){ tState = {stufe, path:"", started:false}; }
  const key = "stufe"+stufe;
  const wrap = el("div",{class:"tablet s"+stufe});
  wrap.append(el("div",{class:"level-tag"}, el("span",{style:"font-size:1.8rem","aria-hidden":"true"},STUFEN[stufe].sym), "Euer Zeichen: "+STUFEN[stufe].name));
  const geschichte = G().geschichte;
  if(!tState.started){
    wrap.append(el("div",{class:"story s"+stufe}, el("p",{}, FIGUR+" hat eine Geschichte für euch. Ihr entscheidet, wie es weitergeht.")),
      el("button",{class:"btn primary",type:"button",style:"font-size:1.4rem",onclick:()=>{tState.started=true; render(); if(stufe===1) speakCurrent(stufe);}},"Los geht's"));
    app.append(wrap); return;
  }
  if(tState.path.length<3){
    const id = tState.path===""?"S":tState.path;
    const k = geschichte.knoten[id];
    const text = k.text[key];
    wrap.append(el("div",{class:"story s"+stufe}, el("p",{}, text)), el("div",{class:"row",style:"margin-bottom:1rem"}, readBtn(()=>text)));
    const depth = tState.path.length;
    const choices = el("div",{class:"choices"});
    ["A","B"].forEach((c,i)=>{
      const m = MERKMALE[depth][i];
      const label = k.optionen[i][key];
      choices.append(el("button",{class:"choice "+c.toLowerCase(),type:"button",onclick:()=>{ tState.path+=c; render(); if(stufe===1) speakCurrent(stufe); }},
        stufe<3 ? el("span",{class:"pic","aria-hidden":"true"},m.pic) : null,
        el("span",{}, label)));
    });
    wrap.append(choices);
  }else{
    const ende = geschichte.enden[tState.path][key];
    const m = merkmaleFuerPfad(tState.path);
    wrap.append(el("div",{class:"story s"+stufe}, el("p",{}, ende)), el("div",{class:"row"}, readBtn(()=>ende)));
    wrap.append(el("p",{style:"font-size:1.3rem;margin-bottom:.2rem"}, el("strong",{},"Kreuzt auf eurer Suchkarte an:")));
    wrap.append(el("div",{class:"result-pics"}, m.map(x=>el("div",{}, el("span",{"aria-hidden":"true"},x.pic), x.label))));
  }
  const back = el("div",{class:"row",style:"margin-top:1.2rem"},
    el("button",{class:"btn",type:"button",disabled:tState.path.length===0,onclick:()=>{ tState.path=tState.path.slice(0,-1); render(); }},"Einen Schritt zurück"),
    el("button",{class:"btn",type:"button",onclick:()=>{ tState.path=""; render(); }},"Von vorn"));
  wrap.append(back);
  app.append(wrap);
}
function speakCurrent(stufe){
  const key="stufe"+stufe, g=G().geschichte;
  const t = tState.path.length<3 ? g.knoten[tState.path===""?"S":tState.path].text[key] : g.enden[tState.path][key];
  speak(t);
}

// ---------- Lehrkraftansicht ----------
function validate(d){
  const res=[]; const add=(ok,t)=>res.push({ok,t});
  const g = d.generiert||{}; const r = d.rahmen||{};
  add(!!(r.klasse&&r.bibliothek&&r.programmtitel), "Rahmendaten vollständig (Klasse, Bibliothek, Programmtitel)");
  add(!!(g.brief&&g.brief.text), "Brief vorhanden");
  if(g.brief&&g.brief.text) add(g.brief.text.length<=450, "Brief max. 450 Zeichen ("+g.brief.text.length+")");
  const k = (g.geschichte&&g.geschichte.knoten)||{}; const e=(g.geschichte&&g.geschichte.enden)||{};
  const missingK = KNOTEN_IDS.filter(id=>!k[id]); add(missingK.length===0, "Alle 7 Knoten vorhanden"+(missingK.length?" (fehlt: "+missingK.join(", ")+")":""));
  const missingE = ENDEN_IDS.filter(id=>!e[id]); add(missingE.length===0, "Alle 8 Enden vorhanden"+(missingE.length?" (fehlt: "+missingE.join(", ")+")":""));
  let tooLong=[], missingStufe=[], badOpt=[];
  KNOTEN_IDS.forEach(id=>{ const n=k[id]; if(!n) return;
    Object.keys(LIMITS).forEach(s=>{ const t=n.text&&n.text[s]; if(!t) missingStufe.push(id+"/"+s); else if(t.length>LIMITS[s]) tooLong.push(id+"/"+s+" ("+t.length+")"); });
    if(!Array.isArray(n.optionen)||n.optionen.length!==2) badOpt.push(id);
    else n.optionen.forEach(o=>Object.keys(LIMITS).forEach(s=>{ if(!o[s]) missingStufe.push(id+"/Option/"+s); else if(o[s].length>30) tooLong.push(id+"/Option/"+s+" ("+o[s].length+")"); }));
  });
  ENDEN_IDS.forEach(id=>{ const n=e[id]; if(!n) return; Object.keys(LIMITS).forEach(s=>{ const t=n[s]; if(!t) missingStufe.push(id+"/"+s); else if(t.length>LIMITS[s]) tooLong.push(id+"/"+s+" ("+t.length+")"); }); });
  add(missingStufe.length===0, "Alle Texte in drei Stufen"+(missingStufe.length?" (fehlt: "+missingStufe.slice(0,6).join(", ")+(missingStufe.length>6?" …":"")+")":""));
  add(badOpt.length===0, "Jeder Knoten hat genau zwei Optionen"+(badOpt.length?" (Fehler: "+badOpt.join(", ")+")":""));
  add(tooLong.length===0, "Längengrenzen eingehalten (80/150/250, Optionen 30)"+(tooLong.length?" – zu lang: "+tooLong.slice(0,6).join(", ")+(tooLong.length>6?" …":""):""));
  add(typeof g.abschied==="string"&&g.abschied.length>0&&g.abschied.length<=150, "Abschied vorhanden, max. 150 Zeichen");
  add(Array.isArray(g.luecken), "Lückenliste vorhanden");
  return res;
}

    el("tbody",{}, MERKMALE.map((p,i)=>el("tr",{}, el("td",{},String(i+1)), el("td",{},p[0].pic+" "+p[0].label), el("td",{},p[1].pic+" "+p[1].label)))));
  app.append(el("section",{class:"panel"}, el("h2",{},"Zuordnung der Entscheidungen"), el("div",{class:"table-wrap"},zu)));

    ta,
    el("div",{class:"row",style:"margin-top:.6rem"},
      el("button",{class:"btn primary",type:"button",onclick:()=>{
        try{ const d=JSON.parse(ta.value); if(!d.rahmen||!d.generiert) throw new Error("Die Bereiche „rahmen“ und „generiert“ fehlen.");
          DATA=d; if(!MATERIAL_ID) store("ms_json",JSON.stringify(d)); counts=Object.fromEntries(ENDEN_IDS.map(id=>[id,0])); sentText=""; render(); }
        catch(err){ msg.className="msg bad"; msg.textContent="Nicht geladen: "+err.message; }
      }},"JSON laden"),
      el("button",{class:"btn",type:"button",onclick:()=>{ if(MATERIAL_ID){ location.reload(); } else { DATA=BEISPIEL; store("ms_json",null); render(); } }}, MATERIAL_ID?"Gespeichertes Material neu laden":"Beispiel wiederherstellen")),
    msg));

  const bu = el("input",{type:"text",value:baseUrl()});
  app.append(el("section",{class:"panel"}, el("h2",{},"Adresse für die QR-Codes"),
    el("p",{style:"margin-top:0"},"Die QR-Codes führen zu dieser Adresse. Für den Test mit Tablets muss die Seite unter einer öffentlich erreichbaren Adresse liegen."),
    bu, el("div",{class:"row",style:"margin-top:.6rem"},

function buildTree(path, alle){
  const g=G().geschichte;
  const showText = obj => alle
    ? el("div",{class:"variants"}, [1,2,3].map(n=>el("div",{}, el("strong",{},STUFEN[n].sym+" "), obj["stufe"+n])))
    : el("span",{class:"node"}, obj.stufe2);
  if(path.length===3){
    return el("span",{class:"end"}, "Suchauftrag: ", showText(g.enden[path]));
  }
  const id = path===""?"S":path; const k=g.knoten[id];
  const ul = el("ul",{class:path===""?"tree":""});
  const li = el("li",{}, showText(k.text));
  const sub = el("ul",{});
  ["A","B"].forEach((c,i)=>{
    const m=MERKMALE[path.length][i];
    sub.append(el("li",{}, el("span",{class:"opt"}, m.pic+" "+k.optionen[i].stufe2), el("span",{class:"muted",style:"font-size:.9rem"}, "Merkmal: "+m.label), path.length+1===3 ? buildTree(path+c, alle) : buildTree(path+c, alle)));
  });
  li.append(sub); ul.append(li);
  return ul;
}

// ---------- Router ----------
function currentView(){
  const h = location.hash.replace("#","");
  const m = /^tablet-(\d)$/.exec(h);
  if(m && STUFEN[m[1]]) return {view:"tablet", stufe:Number(m[1])};
  if(h==="lehrkraft") return {view:"lehrkraft"};
  if(h==="suchkarte") return {view:"suchkarte"};
  return {view:"klasse"};
}
function render(){
  try{ speechSynthesis && speechSynthesis.cancel(); }catch(e){}
  const app = document.getElementById("app"); app.innerHTML="";
  if(LOAD_ERROR){
    app.append(el("div",{class:"panel"}, el("h2",{},"Material nicht gefunden"),
      el("p",{}, LOAD_ERROR),
      el("p",{class:"muted"},"Prüfen Sie, ob die Datei im Ordner „materialien“ liegt und genauso heißt wie die ID im Link.")));
    return;
  }
  const v = currentView();
  document.querySelectorAll(".topnav a").forEach(a=>a.setAttribute("aria-current", a.dataset.view===v.view?"page":"false"));
  try{
    if(v.view==="tablet") renderTablet(app, v.stufe);
    else if(v.view==="lehrkraft") renderLehrkraft(app);
    else if(v.view==="suchkarte") renderSuchkarte(app);
    else renderKlasse(app);
  }catch(err){
    app.append(el("div",{class:"panel"}, el("h2",{},"Die Seite kann nicht dargestellt werden"),
      el("p",{},"Das geladene JSON passt nicht zum Schema: "+err.message+". Öffnen Sie die Lehrkraftansicht und stellen Sie das Beispiel wieder her."),
      el("a",{class:"btn",href:"#lehrkraft"},"Zur Lehrkraftansicht")));
  }
}
async function init(){
  if(MATERIAL_ID){
    if(!/^[A-Za-z0-9_-]{1,40}$/.test(MATERIAL_ID)){
      LOAD_ERROR = "Die Material-ID im Link ist ungültig. Erlaubt sind Buchstaben, Ziffern, - und _.";
    }else{
      try{
        const r = await fetch("materialien/"+MATERIAL_ID+".json", {cache:"no-store"});
        if(!r.ok) throw new Error("Die Datei materialien/"+MATERIAL_ID+".json wurde nicht gefunden (Status "+r.status+").");
        const d = await r.json();
        if(!d.rahmen || !d.generiert) throw new Error("Die Datei enthält nicht die Bereiche „rahmen“ und „generiert“.");
        DATA = d;
      }catch(err){ LOAD_ERROR = err.message || "Die Inhalte konnten nicht geladen werden."; }
    }
  }
  window.addEventListener("hashchange", render);
  render();
}
document.getElementById("app").textContent = "Inhalte werden geladen …";
init();
</script>
</body>
</html>
